title: Pharmacy QI fixes were followed by an 81% cut in order-query resolution time
summary: 'After a new clinical information system at a Canadian tertiary hospital, a pharmacy improvement group used process mapping to find two sources of wasted time: finding the information needed, and finding the right clinical pharmacist to ask. After four fixes (clearer verification principles, streamlined resources, clarified roles, updated contact lists), time to resolve medication orders needing clarification fell by 81%.'
intervention: Quality improvement working group using process mapping and four action plans
comparator: Time to resolution before the changes
