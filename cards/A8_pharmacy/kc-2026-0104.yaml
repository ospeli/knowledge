id: kc-2026-0104
version: 1
status: candidate
title: Lean redesign of ICU medicine ordering and supply cut wasted doses by about a third
summary: A Dutch academic ICU measured wasted medication for three weeks, found causes with staff (over-ordering, over-supply and over-preparation, therapy changes), then changed protocols, ran awareness campaigns and sent labelled medicines with patients on transfer. Waste fell by 31.8% per 100 beds per day and its value by 18.4%.
intervention: Lean-based redesign of medicine ordering, supply and preparation
comparator: Three-week baseline before implementation
source:
  doi: 10.1007/s11096-026-02214-z
  tier: A
  licence: cc-by
  url: https://doi.org/10.1007/s11096-026-02214-z
domains:
- A8_pharmacy
- B4_supply_chain
design: before_after
evidence_level: OE5
setting:
  country: NL
  income: HIC
  facility: academic_hospital_icu
kpis:
- name: medication_units_wasted_change_pct
  definition: Change in disposed medication units per 100 ICU beds per day
  effect:
    value: '-31.8'
    unit: percent
  evidence:
    quote: Implementing these interventions reduced medication waste by 31.8% to 77 units per 100 ICU beds per day, and economic losses decreased by 18.4% to €846.
- name: medication_waste_value_change_pct
  definition: Change in value of wasted medication per 100 ICU beds per day
  effect:
    value: '-18.4'
    unit: percent
  evidence:
    quote: Implementing these interventions reduced medication waste by 31.8% to 77 units per 100 ICU beds per day, and economic losses decreased by 18.4% to €846.
- name: baseline_units_wasted
  definition: Baseline mean disposed medication units per 100 ICU beds per day
  effect:
    value: '113'
    unit: units
  evidence:
    quote: At baseline, a mean total of 113 units, worth €1037, were wasted daily per 100 ICU beds.
implementation_needs:
- waste count by item (what was thrown away and why)
- staff sessions to find causes
- ward stock and order quantities reviewed
lmic_applicability: partial
notes: 'Single-site before-after with short measurement periods and no CI: OE4 downgraded to OE5. Supports the stock object (B4 and A6 pharmacy stock) and X1 lean method: count waste, ask staff for causes, change order and supply rules. No prescribing content. LMIC partial: waste counting is low tech; the savings depend on local drug prices.'
review_by: '2031-11-15'
