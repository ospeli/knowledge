title: In a hospital delivery simulation, more lift capacity cut lateness more than dispatch rules did
summary: A simulation replayed 33,079 real hospital delivery requests to compare human-only dispatch with robot dispatch rules. Pickup travel loaded a shared bank of lifts; in one high-staffing case, raising assumed lift capacity from two to four cut late human-only deliveries from 55.11% to 3.18%, more than the differences between dispatch rules.
intervention: 'Scenario: more lift capacity; resource-aware robot dispatch'
