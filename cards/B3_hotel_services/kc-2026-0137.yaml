id: kc-2026-0137
version: 1
status: candidate
title: Shared lifts, not dispatch rules, drove late hospital deliveries in a simulation
summary: A simulation replayed 33,079 real hospital delivery requests to compare human-only dispatch with robot dispatch rules. Pickup travel loaded a shared bank of lifts; in one high-staffing case, doubling lift capacity from two to four cut late human-only deliveries from 55.11% to 3.18%, a bigger effect than any dispatch rule.
intervention: 'Scenario: more lift capacity; resource-aware robot dispatch'
comparator: Human dispatch with two lifts (simulated)
source:
  doi: 10.48550/arxiv.2610.05971
  tier: B
  licence: cc-by-sa
