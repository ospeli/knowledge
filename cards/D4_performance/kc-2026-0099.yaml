title: Routine EHR data matched manual chart review for hospital outcome reporting
summary: Across 113 US Veterans Affairs facilities (460,585 operations, 2016-2020), hospital risk-adjusted 30-day post-operative mortality ratios built from routine electronic record data correlated with those built from manually abstracted data at r = 0.98, and 99.3% of hospital-quarters were classed the same. Of quarters flagged as worse than expected by the manual method, 81.0% were also flagged by the EHR method.
intervention: Risk adjustment using routinely recorded EHR variables
comparator: Manually abstracted registry variables (VASQIP)
