setting:
  country: ID
  income: UMIC
  facility: public_hospital
  sites: 40
kpis:
- name: efficiency_correlates
  definition: Factors significantly associated with DEA financial efficiency score
  effect:
    value: average length of stay, support staff, physicians, COVID-19 period; not bed occupancy or turnover interval
  evidence:
    quote: Tobit regression indicates that average length of stay, number of supporting staff, number of physicians, and the COVID-19 period are significantly correlated with efficiency, while bed occupancy ratio, turnover interval, and nonphysician health personnel are not.
implementation_needs:
