notes: 'Multi-site panel with no effect sizes or CIs in the abstract: OE4. Direction of the ALOS association not stated in the abstract, so not claimed. Efficiency here is financial (revenue output), not clinical. For D4: a benchmark view can show ALOS and BOR side by side, but BOR alone was not associated with efficiency. LMIC yes: Indonesia.'
