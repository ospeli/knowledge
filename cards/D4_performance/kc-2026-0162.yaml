id: kc-2026-0162
version: 1
status: approved
title: Stay length and staffing, not occupancy, linked to efficiency in 40 Indonesian hospitals
summary: A data envelopment analysis of 40 Indonesian police hospitals (2020 to 2024) found most were not fully efficient in turning spending into revenue. Average length of stay, support staff numbers, physician numbers and the COVID-19 period were significantly associated with efficiency; bed occupancy ratio and turnover interval were not.
intervention: None (two-stage DEA and Tobit panel analysis)
comparator: Hospitals on vs off the efficiency frontier
