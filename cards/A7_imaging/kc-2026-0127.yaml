kpis:
- name: outpatient_wait_minutes
  definition: Outpatient waiting time reported across Indian OPD studies
  effect:
    value: 90–120 or more
    unit: minutes
  evidence:
    quote: Indian outpatient department (OPD) waiting-time studies consistently document waits of 90–120 minutes or more against consultation or procedure times of only a few minutes, with delay attributable primarily to departmental process factors rather than patient behaviour.
implementation_needs:
- time stamps for order, billing, scan and report
- priority flag on imaging requests
- queue position shown to patients
lmic_applicability: 'yes'
notes: 'Narrative review, no systematic search or appraisal; the framework is proposed, not tested: OE5. For A5 diagnostics (ultrasound slots) and A1: time each step from order to report so the wait can be split from scan time. LMIC yes: Indian walk-in model.'
