id: kc-2026-0127
version: 1
status: candidate
title: Indian outpatient waits of 90–120 minutes stem mainly from department process
summary: A narrative review of Indian outpatient waiting-time studies found waits of 90 to 120 minutes or more for consultations or procedures lasting minutes, mostly due to departmental process. For walk-in CT and ultrasound it proposes a seven-point framework, including real-time order transmission, priority queues and turnaround monitoring.
intervention: Proposed framework for walk-in CT and ultrasound (order transmission, decoupled billing, predictive staffing, priority queuing, parallel preparation, queue communication, turnaround monitoring)
comparator: First-come, first-served walk-in processing
