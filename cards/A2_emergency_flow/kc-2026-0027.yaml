id: kc-2026-0027
version: 1
status: candidate
title: District emergency centre clinicians carried a median of 1.5 patients at once
summary: In a South African district emergency centre, clinicians carried a median of 1.5 unresolved patients at any time (peak 3), varying by clinician type and shift; this "active queue" adds to patients-per-hour for staffing plans.
source:
  doi: 10.1016/j.afjem.2026.101021
  tier: A
  licence: cc-by
  url: https://europepmc.org/article/MED/42966911
domains:
- A2_emergency_flow
- C1_workforce
design: other
evidence_level: OE5
setting:
  country: ZA
  income: UMIC
  facility: district_hospital_emergency_centre
kpis:
- name: active_queue_median_patients
  definition: Median and median peak number of unresolved patients per clinician during a shift
  effect:
    value: 1.50 (peak 3.00)
    unit: patients
  evidence:
    quote: Median AQ was 1.50 (IQR 1.00-2.25), with a median peak AQ of 3.00 (IQR 2.00-4.00).
implementation_needs:
- timestamped patient flow data per clinician
- shift-level reporting
lmic_applicability: 'yes'
notes: Retrospective cross-sectional analysis of 1,289 clinician shifts (2019) at one district EC. Descriptive metric with associations by clinician category, employment and shift type (abstract truncates the p values). Observational single site, OE5. Directly relevant to LMIC district hospitals.
review_by: '2031-11-07'
