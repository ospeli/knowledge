id: kc-2026-0076
version: 1
status: candidate
title: Multicomponent ED programme raised outpatient management of low-risk PE over 3 years
summary: In one academic ED, a programme tackling barriers to sending low-risk pulmonary embolism patients home raised the share discharged from the ED from about 5% to a third by year three, with no 30-day deaths or recurrences after discharge.
intervention: Multicomponent ED intervention addressing barriers to outpatient management of low-risk PE, evaluated with RE-AIM
comparator: 3-year pre-implementation period (2016–2019)
source:
  doi: 10.1016/j.annemergmed.2026.08.738
  tier: A
  licence: cc-by
  url: https://doi.org/10.1016/j.annemergmed.2026.08.738
domains:
- A2_emergency_flow
- A3_inpatient_flow
design: before_after
evidence_level: OE5
setting:
  country: unknown
  income: unknown
  facility: quaternary_academic_ed
kpis:
- name: ed_discharge_rate_low_risk_pe_pct
  definition: Share of low-risk (PESI 85 or less) PE patients discharged from the ED, pre-implementation vs maintenance year
  effect:
    value: 5.1 vs 33.3
    unit: percent
  evidence:
    quote: Adoption rose from 5.1% preimplementation to 16.1% (odds ratio [OR] 3.43, 95% confidence interval [CI] 1.77 to 6.63), 24.0% (OR 5.98, 95% CI 3.04 to 11.78), and 33.3% (OR 9.24, 95% CI 5.04 to 16.92) in years I to III.
- name: ed_discharge_odds_year3
  definition: Odds of ED discharge for low-risk PE in maintenance year III vs pre-implementation
  effect:
    value: '9.24'
    unit: odds ratio
    ci:
    - '5.04'
    - '16.92'
  evidence:
    quote: Adoption rose from 5.1% preimplementation to 16.1% (odds ratio [OR] 3.43, 95% confidence interval [CI] 1.77 to 6.63), 24.0% (OR 5.98, 95% CI 3.04 to 11.78), and 33.3% (OR 9.24, 95% CI 5.04 to 16.92) in years I to III.
implementation_needs:
- agreed eligibility definition for the target group
- outpatient follow-up arrangements
- adoption metric tracked over time
lmic_applicability: uncertain
notes: 'Single-centre pre/post implementation study (1,810 PE patients, 705 low-risk). OE5: single site, no concurrent control. Card covers the operational KPI only (ED discharge / admission avoidance); clinical eligibility criteria are for clinicians to set and are not advice. Country not stated in the abstract. LMIC applicability uncertain: depends on reliable outpatient follow-up.'
review_by: '2031-11-10'
