id: kc-2026-0030
version: 1
status: candidate
title: Golden-hour QI cut time to first antibiotic for febrile children with cancer
summary: In a Jordanian paediatric ER, automatic top-priority triage, starting antibiotics before blood counts for high-risk cases, and monthly audit feedback cut median arrival-to-antibiotic time from 120 to 50 minutes, sustained for years without extra staff.
intervention: 'Golden Hour QI (FOCUS-PDCA): automatic category-A triage for febrile children with cancer, pre-count antibiotic start for high-risk cases, staff education, monthly audit and feedback'
comparator: Pre-intervention baseline (Dec 2018 to Jun 2019)
source:
  doi: 10.3389/fped.2026.1920472
  tier: A
  licence: cc-by
  url: https://doi.org/10.3389/fped.2026.1920472
domains:
- A2_emergency_flow
- C2_quality_safety
design: before_after
evidence_level: OE5
setting:
  country: JO
  income: UMIC
  facility: specialist_cancer_centre_paediatric_er
kpis:
- name: arrival_to_antibiotic_minutes
  definition: Median time from ER arrival to antibiotic, pre vs implementation period
  effect:
    value: 120 to 50
    unit: minutes
  evidence:
    quote: Median time from ER arrival to antibiotic administration decreased from 120 min (IQR, 97–143) at pre-intervention baseline to 50 min (IQR, 40–65) across the implementation period ( p < 0.01).
- name: sixty_minute_target_compliance_pct
  definition: Share of episodes meeting the 60-minute target, pre vs 2021–2024
  effect:
    value: 22 to 85–90
    unit: percent
  evidence:
    quote: Compliance with the 60 min target improved from 22% in the pre-intervention period to a sustained 85%–90% range across 2021–2024, with the ≥90% target met in all 12 months of 2021 and compliance declining to 85.8% in 2024.
implementation_needs:
- triage rule flagging the target group
- time-stamped audit with monthly feedback
- staff education
lmic_applicability: 'yes'
notes: Single-site before-after QI with historical control; 1,164 intervention visits over 5.5 years. No CIs. OE4 downgraded to OE5. The card covers the process timing (triage, audit), not the clinical treatment choice, which follows local protocol. Authors report no extra funding, staff or technology.
review_by: '2031-11-07'
