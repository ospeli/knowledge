title: Waits for admission from Sicilian EDs ran far longer than waits for discharge
summary: In a sample of 10,077 visits from the 16 largest hospitals in Sicily in 2019, median ED length of stay was 1.70 hours for discharged patients and 3.77 hours for admitted patients, and at the 90th percentile 7.10 vs 34.95 hours. Large differences between EDs in time to admission led the authors to suggest targeting any extra inpatient capacity at the specific wards receiving these patients, not across the whole hospital.
intervention: None (observational analysis of ED length of stay by exit route)
