notes: 'Multi-site retrospective competing-risks frailty model on pre-COVID data; descriptive, no intervention, and the reported medians and 90th percentiles carry no CI, so OE4 downgraded to OE5 (reviewer). For the bed board: report ED waits split by exit route and by receiving ward, and watch the upper tail (90th percentile), not only the median. Disease-group findings left out as clinical detail. LMIC partial: the measure transfers wherever ED times and exit route are recorded. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers re-checked against the PubMed abstract by ospeli-review-bot on 2026-11-13.'
