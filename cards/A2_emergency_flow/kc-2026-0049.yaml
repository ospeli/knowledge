id: kc-2026-0049
version: 1
status: approved
title: Door-to-balloon times in LMICs vary widely; activation and referral design matter
summary: A systematic review of 24 studies in 11 low- and middle-income settings found door-to-balloon times from 34 to 169 minutes; single-call activation, continuous cath-lab cover, training and organised referral were reported alongside shorter times.
intervention: 'Organisational facilitators: single-call cath-lab activation, continuous pPCI availability, team training, direct ED-to-cath-lab transfer, audit and feedback, referral networks'
comparator: Settings with transfer, financial, administrative and out-of-hours delays
source:
  doi: 10.1186/s12872-026-06926-y
  tier: A
