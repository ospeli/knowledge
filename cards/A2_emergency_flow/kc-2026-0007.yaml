title: Longer door-to-room time predicted ambulance diversion, boarding did not
summary: At one urban ED, higher visit volume and longer door-to-room times were linked to ambulance redirection being switched on, while boarding time and admission count were not.
comparator: Days without redirection
source:
  doi: 10.5811/westjem.20766
  tier: A
  licence: cc-by
  url: https://doi.org/10.5811/westjem.20766
domains:
