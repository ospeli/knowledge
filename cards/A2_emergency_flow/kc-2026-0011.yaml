title: Two in five ED patients stayed over four hours at a Nepal tertiary hospital
summary: In a two-week study at a tertiary ED in Nepal, median ED stay was 3.6 hours and 41% stayed longer than four hours; consultations, advanced tests, payment method and age were linked to longer stays.
