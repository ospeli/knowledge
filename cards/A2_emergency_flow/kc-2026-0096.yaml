id: kc-2026-0096
version: 1
status: approved
title: Staff hourly crowding ratings on a smartwatch tracked ED occupancy moderately
summary: In one Korean tertiary ED over 449 hours during a physician shortage, 28 clinicians gave hourly 0-200 crowding ratings on a smartwatch, with a 97.86% response rate. The hourly median rating correlated with the ED occupancy ratio (r=0.542) and NEDOCS (r=0.483) but not with EDWIN (r=0.060), which became significant only after adjusting for time of day. The authors see it as a complementary measure, not a workload or prediction tool.
intervention: Hourly perceived-crowding rating on a smartwatch (ecological momentary assessment)
comparator: Objective crowding scores (EDOR, NEDOCS, EDWIN)
