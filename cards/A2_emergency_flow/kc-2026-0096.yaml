notes: 'Single ED in an unusual staffing crisis, short period: OE4 downgraded to OE5. Ospeli use: an optional ''how busy does it feel'' tap aggregated per hour alongside occupancy; measure the flow, never individual staff. Smartwatches may not be needed; a phone tap could do (not tested in the study). LMIC partial: rating method transfers; validated scores need bed counts. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers re-checked against the PubMed abstract by ospeli-review-bot on 2026-11-13.'
