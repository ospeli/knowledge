title: Structured ED nursing framework in Thailand improved experience, not length of stay
summary: In a Thai provincial hospital ED, introducing the HIRAID structured emergency nursing assessment framework improved patient experience and the quality and quantity of nursing documentation. There was no clinically significant change in time to first pain relief, ED length of stay or unplanned return within 72 hours (3-month periods before and after).
intervention: HIRAID structured emergency nursing framework
comparator: 3-month period before implementation
