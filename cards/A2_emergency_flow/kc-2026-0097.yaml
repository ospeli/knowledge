notes: 'Single site quasi-experimental pre/post; the abstract gives no effect sizes, so OE4 downgraded to OE5. A useful null result: a documentation and assessment framework did not move flow KPIs. The nursing assessment content is clinical and out of scope. LMIC yes: run in a resource-limited setting. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers re-checked against the PubMed abstract by ospeli-review-bot on 2026-11-13.'
