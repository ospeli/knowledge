title: Outreach calls and primary care slots raised 7-day follow-up after youth MH ED visits
summary: A 12-month quality improvement project across two EDs and three primary care sites raised completed 7-day follow-up after youth mental health ED discharges from 28.7% to 40.3%, with no change in 30-day returns.
intervention: Post-discharge phone outreach plus protected paediatric primary care access
comparator: Baseline period before the QI project
