  income: UMIC
  facility: tertiary_teaching_hospital_ed
kpis:
- name: forecast_mae_visits_per_hour
  definition: Mean absolute error of hourly ED arrival forecast, composite model
  effect:
    value: '2.62'
    unit: visits per hour
  evidence:
    quote: Overall, the composite model achieved the best performance with an RMSE of 3.48 visits per hour, an MAE of 2.62 visits per hour, and an R ² of 0.68.
implementation_needs:
- several years of time-stamped ED arrivals
- neighbourhood-level social data
- staffing process that can act on hourly forecasts
lmic_applicability: partial
notes: 'Single-site retrospective model (213,138 encounters); compared against weather-only models but no prospective test of staffing impact; no CIs. OE4 downgraded to OE5 (as for kc-2026-0015). Ospeli use: forecasts are suggestions for rota decisions by people, with an off switch. LMIC: needs reliable arrival time stamps; social data may be unavailable.'
