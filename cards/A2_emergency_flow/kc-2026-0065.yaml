title: Hourly ED demand forecast within about 2–3 patients per hour using social data
summary: At a Wuhan teaching hospital, a machine-learning model using neighbourhood social determinants beat weather-only models and forecast hourly ED arrivals with a mean absolute error of 2.62 visits per hour.
intervention: XGBoost hourly ED demand forecast with social determinants of health features
comparator: Models using weather variables alone
source:
  doi: 10.1038/s41746-026-03378-8
  tier: B
  licence: cc-by-nc-nd
