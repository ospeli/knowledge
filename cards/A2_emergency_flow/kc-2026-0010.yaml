  country: CA
  income: HIC
  facility: university_hospital_network
  sites: 5
kpis:
- name: hospital_los_gmr_handoff
  definition: Adjusted geometric mean ratio of hospital length of stay, handoff vs no handoff
  effect:
    value: '1.01'
    unit: ratio
    ci:
    - '0.96'
    - '1.08'
  evidence:
    quote: 'No significant association was observed between handoffs and in-hospital mortality (adjusted risk ratio [aRR] = 1.11; 95% CI: 0.94-1.30),ICU admission (aRR = 1.06; 95% CI: 0.91-1.23),or hospital length of stay (adjusted geometric mean ratio [aGMR] = 1.01; 95% CI: 0.96-1.08).'
implementation_needs:
