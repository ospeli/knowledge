title: ED doctor-to-doctor handoffs not linked to longer hospital stay
summary: Across five EDs, admitted patients whose care was handed over between emergency physicians did not have longer hospital stays, more deaths or more ICU admissions after adjustment.
comparator: ED visits with no physician handoff
source:
  doi: 10.7759/cureus.117821
  tier: A
  licence: cc-by
  url: https://doi.org/10.7759/cureus.117821
