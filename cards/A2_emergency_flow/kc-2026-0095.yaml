id: kc-2026-0095
version: 1
status: candidate
title: Building the troponin test pathway into the EHR was linked to shorter ED stays
summary: Across 4 urban US EDs in one health system (16,094 chest-pain encounters), moving to a high-sensitivity troponin assay inside an EHR-integrated pathway was associated with mean ED length of stay falling from 6.18 to 5.64 hours. Time from first test order to second result fell from 5.16 to 3.18 hours for admitted patients and from 4.54 to 2.78 hours for discharged patients.
intervention: High-sensitivity troponin assay within an EHR-integrated pathway (orders, timing of repeat test)
comparator: Conventional troponin assay, previous year
source:
  doi: 10.1001/jamanetworkopen.2026.42980
  tier: C
  licence: unknown
  url: https://doi.org/10.1001/jamanetworkopen.2026.42980
domains:
- A2_emergency_flow
- A6_laboratory
design: before_after
evidence_level: OE4
setting:
  country: US
  income: HIC
  facility: urban_ed
  sites: 4
kpis:
- name: mean_ed_los_hours
  definition: Mean time from registration to ED departure, chest-pain patients with a troponin result (pre 95% CI 6.10-6.26; post 5.57-5.71)
  effect:
    value: 6.18 to 5.64
    unit: hours
  evidence:
    checked_by: ''
- name: serial_test_interval_admitted_hours
  definition: Mean time from first troponin order to second result, admitted patients
  effect:
    value: 5.16 to 3.18
    unit: hours
  evidence:
    checked_by: ''
- name: serial_test_interval_discharged_hours
  definition: Mean time from first troponin order to second result, discharged patients
  effect:
    value: 4.54 to 2.78
    unit: hours
  evidence:
    checked_by: ''
implementation_needs:
- order set with timed repeat test
- lab and ED timestamps linked
- ED length of stay by presenting complaint
lmic_applicability: uncertain
notes: 'Retrospective pre/post across 4 EDs with CIs but no concurrent control; secular trends possible. Kept at OE4. Card covers workflow timing only (serial test interval, ED length of stay); the choice of assay and the clinical pathway are clinical decisions outside Ospeli. For A5 diagnostics: track order-to-result time for repeat tests. LMIC uncertain: depends on assay and EHR availability. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers copied as stated and need evidence.checked_by from a reviewer before approval.'
review_by: '2031-11-12'
