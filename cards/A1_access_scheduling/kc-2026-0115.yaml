implementation_needs:
- automatic reminder before each booking
- record of reminder sent and confirmed
- did-not-attend rate tracked to test whether reminders work
lmic_applicability: partial
notes: 'Cross-sectional survey of perceived effectiveness only; objective attendance was not assessed: OE5. Tier C: finding written from the PubMed abstract (PMID 42912695), no quotes; a human reviewer must check numbers. For A1: start with automatic reminders, and measure the did-not-attend rate rather than relying on staff impressions. LMIC partial: SMS transfers widely; booking platforms less so.'
