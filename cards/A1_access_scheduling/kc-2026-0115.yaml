title: Physiotherapists rated booking-platform and SMS reminders effective; posters were not
summary: A national survey of 1,246 private physiotherapists in France found online booking platform reminders and SMS reminders rated effective by about 79% and 78% of users, against 20% for in-clinic posters. Attendance itself was not measured.
intervention: Digital appointment reminders (booking platform, SMS)
comparator: Other strategies, such as in-clinic posters
