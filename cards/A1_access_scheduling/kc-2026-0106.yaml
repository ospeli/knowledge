title: Booked eye-clinic patients waited less than walk-ins; the gain varied by department
summary: A survey of 996 waits in two outpatient departments of a Chinese tertiary hospital found that, after adjustment, booked patients in ophthalmology waited 6.43 minutes less than walk-ins. The study title reports that the gain differed by department; the stored abstract stops before the other department and satisfaction results.
