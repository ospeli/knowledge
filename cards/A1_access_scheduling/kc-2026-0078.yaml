id: kc-2026-0078
version: 1
status: candidate
title: Language filter in EHR scheduling queue raised 10-day booking for non-English speakers
summary: At an academic outpatient rehabilitation service, a visible "preferred language" field and filter in the referral work queue let schedulers prioritise patients with a non-English language preference, raising the share booked within 10 days. Only about a fifth of schedulers used it regularly and gaps remained.
intervention: Sortable preferred-language field and toggle filter in the EHR referral work queue
comparator: Pre-intervention period; English-proficient patients as reference group
source:
  doi: 10.1093/ptj/pzag104
  tier: B
  licence: cc-by-nc
  url: https://europepmc.org/article/MED/42841669
domains:
- A1_access_scheduling
- A5_outpatients
design: its_uncontrolled
evidence_level: OE4
setting:
  country: unknown
  income: unknown
  facility: academic_outpatient_rehabilitation
kpis:
- name: scheduled_within_10_days_relative
  definition: Adjusted relative likelihood of scheduling within 10 days after the intervention, non-English vs English preference patients
  effect:
    value: '2.86'
    unit: relative likelihood
    ci:
    - '1.82'
    - '4.48'
  evidence:
    quote: Patients with NELP demonstrated a larger increase in the likelihood of scheduling within 10 days following the intervention (adjusted RL = 2.86, 95% CI = 1.82-4.48) relative to patients with EP.
- name: scheduled_within_10_days_pct
  definition: Share of referrals scheduled within 10 days, pre vs post
  effect:
    value: 27.4 vs 31.3
    unit: percent
  evidence:
    quote: Scheduling within 10 days improved from 27.4% to 31.3% pre- and post-intervention.
- name: scheduler_tool_use_pct
  definition: Share of schedulers regularly using the tool (implementation fidelity)
  effect:
    value: '22'
    unit: percent
  evidence:
    quote: Implementation fidelity varied, with 22% of schedulers regularly using the tool.
implementation_needs:
- language preference captured in referral data
- work-queue filter
- scheduler training and accountability
lmic_applicability: partial
notes: 'Interrupted time series, 19,260 referrals (Sep 2024–May 2025), one academic centre. OE3 downgraded to OE4: single site. Abstract does not state whether 27.4% to 31.3% refers to the language group or all referrals; check source. Country not stated. Low fidelity suggests pairing with capacity and accountability. LMIC applicability partial: the work-queue visibility idea transfers to any digital referral queue.'
review_by: '2031-11-10'
