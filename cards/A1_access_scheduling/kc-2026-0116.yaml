id: kc-2026-0116
version: 1
status: candidate
title: A pulmonary clinic had a 42.5% no-show rate; inpatient referrals missed more often
summary: In one academic outpatient pulmonary clinic, 42.5% of appointments were no-shows and the actual follow-up interval was about twice the intended one. Appointments referred from an inpatient stay had higher odds of no-show; external outpatient referrals had lower odds.
intervention: None (retrospective analysis of appointment outcomes by referral source and other factors)
comparator: Appointments with other referral sources
source:
  doi: 10.1177/23743735261502057
  tier: B
  licence: cc-by-nc
  url: https://doi.org/10.1177/23743735261502057
domains:
- A1_access_scheduling
- A5_outpatients
design: other
evidence_level: OE5
setting:
  country: unknown
  income: unknown
  facility: academic_tertiary_outpatient_clinic
kpis:
- name: no_show_rate_pct
  definition: Share of non-cancelled appointments not attended, 2017-2019
  effect:
    value: '42.5'
    unit: percent
  evidence:
    quote: Among 1,612 patients, 4,689 appointments were scheduled. After excluding 1,247 cancellations and 6 appointments with indeterminate disposition, 3,436 appointments among 1,479 patients were included in the no-show analysis; 1,461 (42.5%) were no-shows.
- name: follow_up_interval_weeks
  definition: Average intended versus actual interval between follow-up visits
  effect:
    value: intended 11.2, actual 24.8
    unit: weeks
  evidence:
    quote: Average intended and actual follow-up intervals were 11.2 weeks and 24.8 weeks, respectively.
- name: no_show_odds_inpatient_referral
  definition: Adjusted odds of no-show for appointments referred from an inpatient stay
  effect:
    value: '2.41'
    unit: adjusted odds ratio
  evidence:
    quote: In the complete-case adjusted analysis (3,427 appointments among 1,470 patients), substance use disorders (adjusted odds ratios [aORs], 1.86-3.43; P≤.011), inpatient referral (aOR, 2.41; P<.001), and pneumonia (aOR, 2.63; P=.046) were associated with greater odds of no-show.
- name: no_show_odds_external_referral
  definition: Adjusted odds of no-show for appointments from an external outpatient referral
  effect:
    value: '0.49'
    unit: adjusted odds ratio
  evidence:
    quote: Spanish language (aOR, 0.59; P<.001), charity care (aOR, 0.63; P=.002), and external outpatient referral (aOR, 0.49; P<.001) were associated with lower odds.
implementation_needs:
- appointment outcome recorded for every slot (attended, no-show, cancelled)
- referral source recorded on each booking
- intended follow-up interval recorded at booking
lmic_applicability: partial
notes: 'Single-site retrospective cohort, no confidence intervals in the abstract: OE5. Country is not stated in the abstract. Patient-level factors (diagnoses, language, payment) are deliberately not carded; only referral source is used as an operational lever. The authors suggest standardised follow-up intervals and prediction-based overbooking but did not test them. For A1: report no-show rate by referral source and compare intended with actual follow-up interval. LMIC partial: the measures need only a booking register.'
review_by: '2031-11-17'
