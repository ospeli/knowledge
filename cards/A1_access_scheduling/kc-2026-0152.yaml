title: 'Walk-in clinic: days to first post-discharge visit did not change onward linkage'
summary: Among 165 patients referred at hospital or ED discharge to a walk-in bridge clinic, the time until their first visit was not associated with later linkage to a regular outpatient provider. The authors suggest the walk-in format lets patients come when ready.
intervention: Walk-in (no appointment) bridge clinic after discharge
comparator: Varying time to first visit (all patients used the walk-in clinic; no booked-slot comparison)
