  evidence:
    quote: 'There was no significant association between the amount of time until a patient’s first OUD bridge clinic visit after being referred at discharge from the hospital or ED and eventual outpatient treatment linkage (unadjusted RR 1.00; 95% CI: 0.99, 1.01; p=0.84).'
implementation_needs:
- walk-in sessions alongside booked slots
- referral recorded at discharge
- linkage to a regular provider tracked
lmic_applicability: partial
notes: 'Single-site retrospective cohort with CIs: OE4. Null finding, contrasts with earlier studies; the walk-in explanation is the authors'' interpretation, not tested. Card kept to the scheduling question only (walk-in versus booked follow-up after discharge); no treatment content. Country not stated. For A1: walk-in sessions are a valid visit type for post-discharge follow-up and should be supported alongside booked slots.'
