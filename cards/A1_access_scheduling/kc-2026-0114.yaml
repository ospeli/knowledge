id: kc-2026-0114
version: 1
status: approved
title: Adding e-visits raised a hospital's total outpatient volume 14% and doctor time 16%
summary: In a large public hospital in China, starting online visits alongside office visits was linked to 14% more outpatient visits overall, 16% more total doctor service time and 32% more time per patient, while office visits fell 6%. Demand shifted towards senior doctors, leaving junior doctors' capacity underused.
intervention: Electronic visits added alongside office outpatient visits
comparator: Before e-visits (difference-in-differences)
