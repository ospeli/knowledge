implementation_needs:
- separate session slots for online visits
- triage rule for which requests go online
- volume and time reported per channel and per session type
lmic_applicability: partial
notes: 'Single-hospital difference-in-differences analysis, p values but no CI in the abstract: OE3 downgraded to OE4. Tier C: finding written from the PubMed abstract (PMID 42867968), no quotes; a human reviewer must check numbers. Supports A1 and C1: an online channel adds workload unless it has its own scheduled sessions. Report by session and channel, never by named doctor. LMIC partial: needs reliable connectivity and payment rules for online visits.'
