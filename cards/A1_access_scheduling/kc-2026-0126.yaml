title: Interviews credit pathway coordinators with cutting waste in Norwegian cancer pathways
summary: Interviews across colorectal and prostate cancer pathways in three Norwegian hospitals found pathway coordinators were seen as central to reducing non-value-added activities and bottlenecks between departments. Using real-time data and planning beyond day-to-day operations remained hard.
