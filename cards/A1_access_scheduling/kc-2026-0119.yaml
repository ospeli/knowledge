title: Patients rate SMS and phone reminders highly; digital exclusion limits reach
summary: A scoping review of 45 studies of patient and carer views of technology-based appointment reminders found high satisfaction, mostly with SMS. Digital exclusion, language, confidentiality and socio-economic barriers recurred, and few studies examined who was left out.
intervention: Technology-facilitated appointment reminders (SMS, phone calls, app notifications)
comparator: None
