- name: reminder_engagement_barriers
  definition: Recurring barriers to engaging with reminders
  evidence:
    quote: Recurring barriers included digital exclusion, language challenges, confidentiality concerns, and socio-economic inequalities.
implementation_needs:
- reminder language chosen per patient
- a non-smartphone channel (voice call or SMS)
- minimal content in the message for confidentiality
lmic_applicability: partial
notes: 'Scoping review (no quality appraisal reported) of mostly cross-sectional surveys of perceptions, not attendance outcomes: downgraded to OE4. Income mix of included studies not stated; recorded as mixed. For A1: offer SMS and voice, choose language, keep message content minimal. LMIC partial: SMS is widely usable, but literacy, shared phones and language need design attention.'
