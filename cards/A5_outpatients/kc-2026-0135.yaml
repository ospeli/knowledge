id: kc-2026-0135
version: 1
status: approved
title: An extra weekly clinic and a reminder register were followed by shorter waits and less lost follow-up
summary: At a US safety-net teaching hospital eye clinic, adding one extra weekly procedure clinic was associated with a 37-day shorter time from referral to procedure. Adding a register of high-risk patients with appointment reminders was then associated with lower odds of being lost to follow-up at 3 months and raised clinic attendance.
intervention: One additional weekly procedure session, then a high-risk patient register with appointment reminders
comparator: Historical cohort in the 8 months before (sequential cohorts)
source:
  doi: 10.1002/hcs2.70109
  tier: A
  licence: cc-by
  url: https://doi.org/10.1002/hcs2.70109
domains:
- A5_outpatients
- A1_access_scheduling
design: before_after
evidence_level: OE4
setting:
  country: US
  income: HIC
  facility: safety_net_teaching_hospital_outpatients
kpis:
- name: referral_to_procedure_days
  definition: Days from referral to the procedure, after adding one weekly session
  effect:
    value: -37
    unit: days
  evidence:
    quote: 'The introduction of an additional weekly PRP clinic was associated with a decrease in time from referral to PRP by 37 days ( p < 0.001), increased odds of 3‐month PRP (odds ratio [OR]: 6.53; 95% confidence interval [CI]: 3.03–14.10; p < 0.001) and 3‐month full PRP (OR: 4.66; 95% CI: 2.22–9.78; p < 0.001).'
- name: loss_to_follow_up_3m
  definition: Odds of 3-month loss to follow-up, register and reminders vs historical cohort
  effect:
    value: 0.1
    unit: odds ratio
    ci:
    - 0.01
    - 0.79
  evidence:
    quote: 'Subsequent introduction of a patient registry/appointment reminder system was associated with decreased odds of 3‐month loss‐to‐follow‐up (OR: 0.10; 95% CI: 0.01–0.79; p < 0.05) compared to historical cohort and improved odds of 3‐month ophthalmology clinic adherence (OR: 2.96; 95% CI: 1.18–7.47; p < 0.05) compared to the increased PRP clinic cohort.'
- name: clinic_attendance_3m
  definition: Odds of attending the clinic within 3 months, register and reminders vs extra-session cohort
  effect:
    value: 2.96
    unit: odds ratio
    ci:
    - 1.18
    - 7.47
  evidence:
    quote: 'Subsequent introduction of a patient registry/appointment reminder system was associated with decreased odds of 3‐month loss‐to‐follow‐up (OR: 0.10; 95% CI: 0.01–0.79; p < 0.05) compared to historical cohort and improved odds of 3‐month ophthalmology clinic adherence (OR: 2.96; 95% CI: 1.18–7.47; p < 0.05) compared to the increased PRP clinic cohort.'
implementation_needs:
- referral date and appointment date recorded
- list of patients due for follow-up
- reminder by phone or text before each appointment
lmic_applicability: partial
notes: 'Single-centre retrospective sequential cohorts (115, 74 and 65 encounters) with mixed-effects models and CIs; no concurrent control; OE4. The procedure itself is clinical and out of scope; the operational lessons are capacity (one more session) for referral-to-treatment time, and a due-list with reminders for loss to follow-up. For A1: a ''due for follow-up'' list and reminder log per clinic. LMIC partial: the reminder register is low cost; an extra session needs staff.'
