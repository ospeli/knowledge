version: 1
status: approved
title: Rapid access neurosurgery clinic saw referrals in a median of nine days
summary: A Toronto rapid-access neurosurgery clinic for non-emergency referrals saw patients a median of nine days after referral, managed 79.9% conservatively or back to primary care, and sent only 0.54% to the ED.
intervention: Rapid Access in Neurosurgery (RAIN) ambulatory clinic for subacute referrals
comparator: None (no control group; national 49.9-week referral-to-treatment median is context only)
source:
  doi: 10.1017/cjn.2026.10700
  tier: A
  licence: cc-by
  url: https://doi.org/10.1017/cjn.2026.10700
