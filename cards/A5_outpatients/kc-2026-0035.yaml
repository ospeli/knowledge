- A2_emergency_flow
design: case_study
evidence_level: OE5
setting:
  country: CA
  income: HIC
  facility: academic_neurosurgery_clinic
kpis:
- name: referral_to_consultation_days
  definition: Median referral-to-consultation wait at the rapid access clinic
  effect:
    value: '9'
    unit: days
  evidence:
    quote: The RAIN Clinic achieved a median referral-to-consultation wait time of 9 days (interquartile range (IQR) 6-15).
- name: immediate_ed_transfer_pct
  definition: Share of clinic patients needing immediate ED transfer
  effect:
    value: '0.54'
    unit: percent
  evidence:
    quote: Critically, only 0.54% of patients required immediate ED transfer, suggesting the model safely identifies and manages high-acuity patients in an outpatient setting.
implementation_needs:
- referral triage criteria
- protected rapid-access clinic slots
- pathway back to primary care
lmic_applicability: partial
notes: 'Single-centre prospective series of 2,979 referrals with no control group; the 49.9-week figure is a national referral-to-treatment median, not a like-for-like comparator. OE5. LMIC applicability partial: model is simple but needs specialist time.'
