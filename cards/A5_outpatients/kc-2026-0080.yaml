id: kc-2026-0080
version: 1
status: candidate
title: Standard care pathway for IBD advanced therapy reduced admissions across Dutch centres
summary: A multicentre Dutch study found that introducing a care pathway defining minimum care for patients on advanced IBD therapy kept disease control the same while reducing hospital admissions in the six months after implementation; the effect on ER visits was not sustained.
intervention: Advanced therapy care pathway (defined minimum care) for inflammatory bowel disease
comparator: Pre-implementation period, difference-in-differences analysis
source:
  doi: 10.1136/bmjgast-2026-002381
  tier: B
  licence: cc-by-nc
  url: https://europepmc.org/article/MED/42823103
domains:
- A5_outpatients
- A3_inpatient_flow
design: controlled_before_after
evidence_level: OE4
setting:
  country: NL
  income: HIC
  facility: multicentre_hospitals
kpis:
- name: hospital_admissions_did
  definition: Difference-in-differences estimate for hospital admissions, 6 months post-implementation
  effect:
    value: '-0.06'
    unit: DiD estimate
    ci:
    - '-0.11'
    - '-0.03'
  evidence:
    quote: 'Number of emergency room visits and hospital admissions decreased significantly 6 months postimplementation; however, the effect attributable to the ACP was only maintained for admissions (DiD-estimate visits: -0.05, 95% CI -0.10 to 0.01; DiD-estimate admissions: -0.06, 95% CI -0.11 to -0.03).'
- name: er_visits_did
  definition: Difference-in-differences estimate for emergency room visits, 6 months post-implementation
  effect:
    value: '-0.05'
    unit: DiD estimate
    ci:
    - '-0.10'
    - '0.01'
  evidence:
    quote: 'Number of emergency room visits and hospital admissions decreased significantly 6 months postimplementation; however, the effect attributable to the ACP was only maintained for admissions (DiD-estimate visits: -0.05, 95% CI -0.10 to 0.01; DiD-estimate admissions: -0.06, 95% CI -0.11 to -0.03).'
implementation_needs:
- agreed minimum-care pathway across sites
- outcome measurement to a standard set
- EMR extraction of utilisation
lmic_applicability: uncertain
notes: 'Multicentre prospective quasi-experimental pre/post study with DiD (1,173 patients). The abstract does not describe the comparison group or the unit of the DiD estimate (likely visits or admissions per patient), so OE3 downgraded to OE4; check source. Clinical pathway content is out of scope; card covers utilisation only. LMIC applicability uncertain: advanced IBD therapy services are limited in many LMICs.'
review_by: '2031-11-10'
