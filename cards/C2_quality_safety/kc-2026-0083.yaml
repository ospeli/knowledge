id: kc-2026-0083
version: 1
status: approved
title: Maternal safety model with obstetric high-dependency care linked to better quality trends
summary: A multicomponent maternal safety model, including obstetric high-dependency capacity, in three Colombian Caribbean hospitals had mixed but generally favourable results; at one public hospital, time-series analysis showed falls in adverse outcome scores after implementation.
intervention: Multicomponent maternal safety and technological strengthening model including obstetric high-dependency unit capacity
comparator: Pre-implementation period at each institution
source:
  doi: 10.5334/aogh.5403
  tier: A
  licence: cc-by
  url: https://europepmc.org/article/MED/42909174
domains:
- C2_quality_safety
- A3_inpatient_flow
design: its_uncontrolled
evidence_level: OE4
setting:
  country: CO
  income: UMIC
  facility: public_and_private_hospitals_multisite
kpis:
- name: weighted_adverse_outcome_score_level
  definition: Level change in weighted adverse outcome score (WAOS) after implementation, ITS at one public hospital
  effect:
    value: '-8.30'
    unit: beta (level change)
  evidence:
    quote: interrupted time series analyses showed favourable changes in longitudinal quality indicators, including reductions in weighted adverse outcome score (WAOS) level ( β = -8.30, P = 0.0016) and slope ( β = -1.20, P = 0.0064), adverse outcome index (AOI) level ( β = -1.13, P = 0.0032), and severity index (SI) slope ( β = -0.27, P = 0.030)
- name: adverse_outcome_index_level
  definition: Level change in adverse outcome index (AOI) after implementation, ITS at one public hospital
  effect:
    value: '-1.13'
    unit: beta (level change)
  evidence:
    quote: interrupted time series analyses showed favourable changes in longitudinal quality indicators, including reductions in weighted adverse outcome score (WAOS) level ( β = -8.30, P = 0.0016) and slope ( β = -1.20, P = 0.0064), adverse outcome index (AOI) level ( β = -1.13, P = 0.0032), and severity index (SI) slope ( β = -0.27, P = 0.030)
implementation_needs:
- high-dependency beds and staff within an obstetric rescue system
- monthly quality indicators
- billing and administrative data for costing
lmic_applicability: 'yes'
notes: 'Multisite before-and-after evaluation with ITS only where data allowed (one public hospital); other sites mixed or limited follow-up. Costs rose at the private clinic. Uncontrolled ITS at one site, no CIs in abstract: OE4. Authors say HDUs work best as part of an integrated rescue system, not as isolated infrastructure. Quality indicators are used as service KPIs; no clinical advice. LMIC applicability yes: middle-income, high-risk region.'
review_by: '2031-11-10'
approval:
