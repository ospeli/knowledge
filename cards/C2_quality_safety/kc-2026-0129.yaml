title: Lean can improve teamwork but harms psychological safety when driven by pressure
summary: A scoping review of 17 hospital studies (2003-2023) found Lean can improve teamwork and staff engagement, but may reduce psychological safety and intensify work when driven by managerial pressure rather than participation. Leadership maturity and depth of implementation shaped results.
