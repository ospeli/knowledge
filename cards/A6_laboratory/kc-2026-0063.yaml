lmic_applicability: partial
notes: 'Single-centre pre-post (107 vs 153 patients); unadjusted, no CI, so OE4 downgraded to OE5. The abstract text is garbled in places ("P P"), so the turnaround quote stops before the p-value and its significance cannot be confirmed. Reviewer: the 19.6 h compares the post-period rapid report with the pre-period final report, not like with like. Dual AST cards were also part of the bundle. LOS change is unadjusted and the periods are 18 months apart. Antibiotic-use findings left off (clinical). LMIC: needs capital equipment; satellite incubation alone may be feasible.'
