id: kc-2026-0063
version: 1
status: approved
title: New blood culture workflow gave a rapid susceptibility report 19.6 hours before the old final one
summary: A Chinese laboratory combined satellite incubation in the ED, rapid identification and automated rapid susceptibility reporting; the new rapid susceptibility report for ICU bloodstream infections came 19.6 hours before the old final report, and hospital stay was 5 days shorter in an unadjusted comparison.
intervention: 'Multimodal blood culture workflow: satellite ED incubation, rapid MALDI-TOF identification, automated rapid susceptibility reporting'
comparator: Pre-optimisation period (final susceptibility report)
