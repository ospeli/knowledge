id: kc-2026-0109
version: 1
status: approved
title: In a Delhi hospital lab, the analysis phase took 57% of a 138-minute median turnaround
summary: Using information-system timestamps for 2,505 routine biochemistry and haematology tests at a New Delhi tertiary hospital, the median total turnaround was 138 minutes. The analytical phase took 57% of it, pre-analytical 26% and post-analytical 17%; the authors say administrative steps, specimen transport, information-system delays and result validation also added to it.
intervention: None (turnaround measurement by phase)
comparator: Phases of the same process
