title: Slow lab and imaging turnaround is linked with longer ED stays and boarding
summary: A systematic review found delays in laboratory and radiology results were consistently associated with longer emergency department length of stay and more boarding, and that streamlining diagnostic pathways reduced length of stay in some studies.
intervention: Streamlined diagnostic pathways (various)
comparator: Usual diagnostic processes
source:
