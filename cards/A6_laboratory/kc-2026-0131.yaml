- A2_emergency_flow
design: systematic_review
evidence_level: OE4
setting:
  country: multi
  income: unknown
  facility: hospital_ed
kpis:
- name: diagnostic_tat_and_ed_los
  definition: Association between diagnostic turnaround time and ED length of stay (qualitative)
  evidence:
    quote: The findings indicated that diagnostic delays, particularly in laboratory testing and radiological examinations, were consistently associated with longer ED LOS and increased boarding time.
implementation_needs:
- time stamps for request, sample or scan, and result
- turnaround time shown per test type
lmic_applicability: partial
notes: 'Review in a student journal; number of included studies and quality appraisal not given; review years are inconsistent (2019-2025 in the title, 2022-2026 in the text); mostly observational studies: OE4. For A5 diagnostics: turnaround time is a flow KPI for the ED too. LMIC partial: settings not stated in the abstract.'
