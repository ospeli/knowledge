notes: 'Tier C: abstract read via the PubMed record (PMID 42307504), not stored in the inbox; no quotes; numbers need a human reviewer to fill checked_by. Single-unit before-after over 16 weeks, no statistics, small absolute change: OE5. Country from author affiliation (Michigan) and US reporting scheme. For E4 and A1: a "running late" notice to waiting patients is a cheap screen feature; pairs with B3 cleaning checks. LMIC partial: CAHPS is US-specific; the four pillars transfer.'
