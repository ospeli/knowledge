title: Day-surgery patient scores rose after a four-part service push with delay updates
summary: A community hospital's day-surgery unit worked on its environment (cleanliness, maintenance), greeting at the entrance, telling patients about delays, and a clearer discharge sheet. Over 16 weeks its likelihood-to-recommend score rose by 1.3 points and its peer ranking moved up 31 places.
intervention: 'Four-pillar patient experience initiative: environment of care, greeting service, communication about delays, discharge instruction cover sheet; plus leader rounding'
comparator: Same unit before (January 2025 baseline)
source:
  doi: 10.1016/j.jopan.2026.03.023
  tier: C
  licence: publisher
  url: https://doi.org/10.1016/j.jopan.2026.03.023
