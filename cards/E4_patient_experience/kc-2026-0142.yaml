implementation_needs:
- survey offered on a tablet or phone at a set visit
- '''not applicable'' option on every item'
- reasons for non-completion recorded
lmic_applicability: partial
notes: 'Quality-improvement evaluation of a non-validated instrument, one administration, one clinic: OE5. Transferable design lesson for E4: match questions to the service and stage the patient has reached, offer ''not applicable'', and track completion rate and reasons for non-completion. Clinical content of the service is out of scope. Tier C: abstract read via the PubMed record, not stored in the inbox; no quotes; numbers checked against the PubMed abstract by ospeli-review-bot. LMIC partial: tablets help, a paper or SMS version may be needed.'
