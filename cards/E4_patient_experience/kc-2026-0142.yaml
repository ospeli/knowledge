id: kc-2026-0142
version: 1
status: approved
title: Experience surveys need questions that fit where the patient is in their care
summary: A US cancer centre clinic gave a tablet-based patient experience survey at follow-up visits two to three months after the first consultation; 41 of 70 eligible patients (59%) completed it. Overall ratings were high, but questions about treatments the patient had not yet had drew many 'not applicable' answers.
intervention: Locally designed tablet survey at a fixed follow-up visit
comparator: None (single cross-sectional administration)
source:
  doi: 10.1007/s11060-026-05878-9
  tier: C
  licence: publisher
  url: https://doi.org/10.1007/s11060-026-05878-9
