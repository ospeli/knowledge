  definition: Share of eligible patients who completed the survey at the follow-up visit
  effect:
    value: 59
    unit: percent
  evidence:
    checked_by: ospeli-review-bot
- name: item_applicability
  definition: 'Share of ''not applicable'' answers on stage-dependent items (qualitative: substantial)'
  effect:
