id: kc-2026-0150
version: 1
status: candidate
title: 'Children''s hospital online reviews: communication most common theme, then access'
summary: Of 350 Google Maps reviews of three public children's hospitals in Türkiye, half were negative. Communication and staff attitude was the most common theme; access, appointments and process flow came third, and environment, hygiene and support services fifth.
intervention: Content analysis of online reviews as a patient-experience source
comparator: None
source:
  doi: 10.47115/jshs.2022236
  tier: B
  licence: cc-by-nc
  url: https://doi.org/10.47115/jshs.2022236
domains:
- E4_patient_experience
- B3_hotel_services
design: qualitative
evidence_level: OE5
setting:
  country: TR
  income: UMIC
  facility: public_childrens_hospitals_3
kpis:
- name: review_theme_shares
  definition: Share of reviews mentioning each main theme
  effect:
    value: communication 52.6%; access and flow 29.7%; environment and support services 22.6%
    unit: '% of reviews'
  evidence:
    quote: The most frequently represented theme was “Communication, Staff Attitudes, and Interpersonal Interaction” (n=184, 52.6%), followed by “Overall Judgment and Preference Behavior” (n=171, 48.9%), “Access, Appointments, and Process Flow” (n=104, 29.7%), “Clinical Competence, Treatment, and PatientSafety” (n=93, 26.6%), “Physical Environment, Hygiene, and Support Services” (n=79, 22.6%), “Child-and Family-Specific Care Experience” (n=78, 22.3%), and “Institutional and System-Level Responsibility” (n=61, 17.4%).
- name: negative_review_share
  definition: Share of reviews whose text was negative
  effect:
    value: 49.7
    unit: '% of reviews'
  evidence:
    quote: In terms of textual evaluation direction, 174 reviews (49.7%) were classified as negative, 110(31.4%) as positive, 64(18.3%) as mixed, and 2 (0.6%) as neutral.
implementation_needs:
- feedback form with free text and a theme list
- themes reported by service, not by person
lmic_applicability: partial
notes: 'Qualitative content analysis of self-selected public reviews, three hospitals: OE5. Star ratings missed nuance in mixed reviews, which argues for a free-text box on the E4 form. For E4 and B3: a starter theme list (communication, access and flow, environment and hygiene, support services) for coding feedback; results shown by service, never naming staff.'
review_by: '2031-11-22'
