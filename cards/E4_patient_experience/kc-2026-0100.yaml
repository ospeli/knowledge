title: Digital patient-reported outcome tools were valued but scored poor on usability
summary: In a multicentre feasibility study in Spain, Austria, the Netherlands and Germany, a digital platform for patients to report outcomes on phones, tablets or the web had a mean System Usability Scale score of 44.65/100, and only 115 of 241 participants (47.7%) gave follow-up data, although 83% of respondents would recommend it. Login difficulties, technical instability and weak links to clinical systems were the main problems.
