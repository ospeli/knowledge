id: kc-2026-0110
version: 1
status: candidate
title: Patients rated a hospital blood-test centre low effort; waiting was their main complaint
summary: A university hospital phlebotomy centre surveyed 109 patients and interviewed 8 frequent visitors. The Net Promoter Score was 27.6% and median Customer Effort Score was 1 (low effort). Waiting, not the blood draw, was the main theme; patients asked for shorter waits, a better waiting area and clearer information.
intervention: None (patient experience survey and interviews)
comparator: None
source:
  doi: 10.1093/jalm/jfag165
  tier: A
  licence: cc-by
  url: https://doi.org/10.1093/jalm/jfag165
domains:
- E4_patient_experience
- A6_laboratory
design: mixed_methods
evidence_level: OE5
setting:
  country: unknown
  income: HIC
  facility: university_hospital_phlebotomy_centre
kpis:
- name: net_promoter_score
  definition: Share of promoters minus share of detractors among survey respondents
  effect:
    value: '27.6'
    unit: percent
  evidence:
    quote: In the survey, 34.9% of the respondents were promoters, 53.2% were passives, and 7.3% were detractors, resulting in an NPS of 27.6%.
- name: customer_effort_score_median
  definition: Median Customer Effort Score (1 = lowest effort)
  effect:
    value: '1'
    unit: score
    ci:
    - '1'
    - '2'
  evidence:
    quote: The median CES was 1 (interquartile range 1-2), indicating low perceived effort.
implementation_needs:
- two-question phone survey (NPS and effort) after the visit
- one open question on what to improve
- results by service, not by staff member
lmic_applicability: 'yes'
notes: 'Single-site mixed-methods study with a small sample and no comparator: OE5. The ci field holds the interquartile range 1 to 2, not a confidence interval. Supports E4: a very short survey (NPS, effort, one open question) gives usable signal, and waiting is the main lever. Country not stated in the abstract. LMIC yes: a two-question survey works on any phone.'
review_by: '2031-11-15'
