id: kc-2026-0123
version: 1
status: candidate
title: A digital-twin maintenance model reported 31% less unplanned equipment downtime
summary: A data-driven digital-twin framework for predictive maintenance of MRI scanners, ventilators, infusion pumps and monitors reported 96.4% fault-prediction accuracy and 31% lower unplanned downtime. How and where the downtime reduction was measured is not stated.
intervention: Digital-twin predictive maintenance using sensor telemetry, usage and fault history
comparator: Reactive or time-based maintenance (implied)
source:
  doi: 10.24874/pes08.03.001
  tier: B
  licence: cc-by-nc
  url: https://doi.org/10.24874/pes08.03.001
domains:
- B1_biomedical_engineering
design: other
evidence_level: OE5
setting:
  country: unknown
  income: unknown
  facility: not_stated
kpis:
- name: unplanned_downtime_change_pct
  definition: Reduction in unplanned equipment downtime
  effect:
    value: '-31'
    unit: percent
  evidence:
    quote: Moreover, the framework allows reducing the unplanned equipment downtimes by 31 percent and maintenance expenses by 27 percent on the whole.
- name: maintenance_cost_change_pct
  definition: Reduction in maintenance expenses
  effect:
    value: '-27'
    unit: percent
  evidence:
    quote: Moreover, the framework allows reducing the unplanned equipment downtimes by 31 percent and maintenance expenses by 27 percent on the whole.
- name: fault_prediction_accuracy_pct
  definition: Accuracy of fault prediction; false alarm rate 3.2%
  effect:
    value: '96.4'
    unit: percent
  evidence:
    quote: The proposed digital twin model achieved a fault-prediction accuracy of 96.4% and a false alarm rate of 3.2%.
implementation_needs:
- continuous sensor telemetry from devices
- complete fault and maintenance history per asset
- data science capacity
lmic_applicability: 'no'
notes: 'Model-development paper; data source, setting, validation and whether downtime figures are measured or simulated are not described in the abstract: OE5. Treat the 31% as a claim, not a benchmark. For B1: the transferable lesson is that fault and usage history per asset is the input for any later prediction, so record it from day one; prediction itself stays optional and off by default. LMIC no: needs device telemetry rarely available.'
review_by: '2031-11-17'
