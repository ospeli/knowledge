  country: unknown
  income: unknown
  facility: unknown
kpis:
- name: unplanned_equipment_downtime
  definition: Unplanned equipment downtime with the framework vs without (setting and method not stated)
  effect:
    value: -31
    unit: percent
  evidence:
    quote: Moreover, the framework allows reducing the unplanned equipment downtimes by 31 percent and maintenance expenses by 27 percent on the whole.
- name: maintenance_cost
  definition: Total maintenance expense with the framework vs without
  effect:
    value: -27
    unit: percent
  evidence:
    quote: Moreover, the framework allows reducing the unplanned equipment downtimes by 31 percent and maintenance expenses by 27 percent on the whole.
implementation_needs:
- asset register with fault history
- equipment usage hours recorded
- sensor telemetry (high-end equipment only)
lmic_applicability: uncertain
notes: 'Unvalidated model: the abstract names no hospital, sample or comparison, and the figures may be simulated: OE5. Uncertain: treat the numbers as claims, not expected results. A biomedical engineering manager would use only the low-tech part now: a clean fault history and usage log per asset is the precondition for any predictive maintenance. For B1: keep fault history and downtime per asset; do not promise prediction. LMIC uncertain: telemetry is rare on older equipment.'
