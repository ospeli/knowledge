title: Digital twin model claims a 31% cut in unplanned equipment downtime
summary: A conference-style engineering paper proposes a digital twin for predictive maintenance of critical medical equipment (MRI scanners, ventilators, infusion pumps, monitors), using sensor data, usage history and fault records. The authors report 96.4% fault-prediction accuracy and a 31% fall in unplanned downtime, but the abstract does not say where or how this was measured.
intervention: Digital twin predictive maintenance using telemetry, usage and fault history
comparator: Reactive or time-based maintenance (implied)
source:
  doi: 10.24874/pes08.03.001
  tier: B
  licence: cc-by-nc
  url: https://doi.org/10.24874/pes08.03.001
