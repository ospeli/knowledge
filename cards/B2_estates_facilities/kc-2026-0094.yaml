id: kc-2026-0094
version: 1
status: candidate
title: Staff education and visual aids improved operating-room waste segregation
summary: At a 402-bed US community hospital, education and visual aids for operating room staff raised correct item disposal from 50.5% to 60.2% and cut non-compliant items per audit from 262.2 to 162.5. Total sharps bin waste fell from 612.7 kg to 527.6 kg, and knowledge gains held at 3 months.
intervention: Waste segregation education with visual aids at disposal points
comparator: Pre-education audit
source:
  doi: 10.1097/qmh.0000000000000598
  tier: C
  licence: unknown
  url: https://doi.org/10.1097/qmh.0000000000000598
domains:
- B2_estates_facilities
- B3_hotel_services
- A4_theatres
design: before_after
evidence_level: OE5
setting:
  country: US
  income: HIC
  facility: community_hospital
  beds: 402
kpis:
- name: waste_disposal_compliance_pct
  definition: Share of audited items placed in the correct waste stream
  effect:
    value: 50.5 to 60.2
    unit: percent
  evidence:
    checked_by: ''
- name: noncompliant_items_mean
  definition: Mean number of non-compliant items per audit
  effect:
