implementation_needs:
- waste audit method (item count and weight)
- visual aids at bins
- repeat education
lmic_applicability: 'yes'
notes: 'Single site before-after with no comparison group: OE4 downgraded to OE5. Audit periods may differ in case mix and volume, so bin weights are indicative. Fits B2 waste and B3 support services. LMIC yes: low-cost, and segregation errors drive treatment cost where waste is incinerated or contracted out. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers copied as stated and need evidence.checked_by from a reviewer before approval.'
review_by: '2031-11-12'
