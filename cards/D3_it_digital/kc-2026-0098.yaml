id: kc-2026-0098
version: 1
status: approved
title: In-house open-source AI scribe ran at under US$30 per doctor per month
summary: A Canadian provincial health system ran an in-house AI documentation scribe for emergency physicians (197 physicians, 105 facilities, 21,548 sessions over 9 months), keeping all audio and text inside its own infrastructure. Operating cost averaged under US$30 per physician per month, 70% to 95% below commercial prices (excluding staff costs); survey respondents reported a median 16 to 30 minutes saved per shift and rated documentation quality lowest.
intervention: In-house AI scribe on the health system's own data platform (open-source version released)
comparator: Commercial AI scribe subscription prices
