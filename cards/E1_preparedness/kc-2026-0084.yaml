title: 'Model: severe pandemic bed demand exceeds surge capacity 5–9 fold despite stockpiles'
summary: A modelling study for the UK, Japan and the US found antiviral stockpiles kept hospital bed demand manageable in moderate pandemics, but in severe scenarios daily demand exceeded staffed surge capacity five- to nine-fold even with perfect antiviral coverage. Authors suggest capacity-based planning rather than fixed stockpile targets.
intervention: Capacity-based preparedness planning (comparing bed demand with staffed surge capacity)
comparator: Inventory-based antiviral stockpile target (25% population coverage)
source:
