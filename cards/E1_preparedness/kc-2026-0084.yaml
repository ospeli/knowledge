lmic_applicability: partial
notes: 'Modelling study (static estimate, deterministic transmission model, historical reconstructions) with deliberately optimistic assumptions, so a lower bound; uses general beds as proxy and a 4-day length of stay. OE5 (model, not validated against outcomes). Operational lesson: plan against staffed capacity, not inventory size. LMIC applicability partial: logic applies more strongly where surge capacity is smaller, but modelled countries are high-income.'
