id: kc-2026-0050
version: 1
status: candidate
title: Same-day discharge after complex ablation saved about €480 per patient
summary: In one centre, patients selected for same-day discharge after complex ablation had complication rates similar to next-day discharge, and the policy would have saved €479.84 per patient.
intervention: Same-day discharge (SDD) after complex ablation in selected patients
comparator: Next-day discharge (NDD)
source:
  doi: 10.3390/jcdd13100501
  tier: A
  licence: cc-by
  url: https://doi.org/10.3390/jcdd13100501
domains:
- A3_inpatient_flow
- D1_finance_costing
design: other
evidence_level: OE5
setting:
  country: unknown
  income: unknown
  facility: cardiac_electrophysiology_unit
kpis:
- name: cost_saving_per_patient_eur
  definition: Estimated saving per patient of an SDD policy
  effect:
    value: '479.84'
    unit: EUR (± 248.09 SD)
  evidence:
    quote: The SDD policy for CAP during this period would have saved €479.84 ± €248.09 per patient.
- name: early_minor_complications_sdd_vs_ndd
  definition: Early minor complications, SDD vs NDD
  effect:
    value: 8.6 vs 3.7
    unit: percent
  evidence:
    quote: 'Among patients included in the final analysis, the overall complication rate was low (8.8%), with no differences between groups (early minor complications, 5.4%: 8.6% vs. 3.7% for SDD vs. NDD, p = 0.191; late major complications, 0.5%: 0% vs. 0.7%, p = 1; late minor complications, 3.4%: 2.9% vs. 3.7%, p = 1).'
implementation_needs:
- eligibility criteria for same-day discharge
- observation area with discharge assessment
- early follow-up contact
lmic_applicability: uncertain
notes: Single-centre retrospective observational study (205 of 250 procedures after excluding patients with significant complications or severe pre-ablation conditions); selection into SDD not randomised. OE5. Country not stated (costs in euros). The early-minor-complication difference (p = 0.191) is not significant but numerically higher with SDD. Operational lever is the discharge pathway, not the procedure.
review_by: '2031-11-08'
