kpis:
- name: bedspacing_hazard_ratio
  definition: Hazard of being bedspaced (placed on an off-service ward), occupancy above 115% vs below 85%
  effect:
    value: '1.46'
    unit: hazard ratio
    ci:
    - '1.39'
    - '1.54'
  evidence:
    quote: Regarding bed occupancy, the HR of being bedspaced was 1.46 (95% CI 1.39 to 1.54) when comparing above 115% to less than 85% bed occupancy.
