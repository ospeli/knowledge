title: High bed occupancy raised the chance of patients being outlied to other wards
summary: Across nine hospitals, patients admitted when bed occupancy was above 115% were more likely to be placed on an off-specialty ward (bedspacing) than when occupancy was below 85%.
comparator: Bed occupancy below 85%
