id: kc-2026-0092
version: 1
status: approved
title: Overnight ward tasks left patients under 4 hours of unbroken sleep on average
summary: Using electronic record timestamps for 46,916 admissions on general medical and surgical units at a US academic hospital, overnight medication rounds, vital sign checks and blood draws (grouped into 20-minute episodes) left an average longest uninterrupted sleep opportunity of 3 h 40 min per patient-night, and about 6 h 30 min in total. Longer opportunities went with better patient-reported sleep quality, and the measure varied between units.
intervention: None (observational measure of overnight task interruptions)
comparator: Variation across units and admissions
