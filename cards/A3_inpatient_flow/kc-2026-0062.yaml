id: kc-2026-0062
version: 1
status: approved
title: Not attending ICU follow-up clinic linked to more ICU readmissions in Wales
summary: In linked Welsh data for 6,491 ICU survivors, those invited but not attending a follow-up clinic, and those never invited, had higher adjusted odds of ICU readmission than attendees, plus more elective admissions and bed days.
intervention: Attendance at a post-ICU follow-up clinic (exposure)
comparator: Invited non-attendees and patients not invited
source:
  doi: 10.1097/cce.0000000000001500
  tier: B
  licence: cc-by-nc-nd
  url: https://europepmc.org/article/MED/42965250
