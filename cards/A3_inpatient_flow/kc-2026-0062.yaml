implementation_needs:
- referral criteria for ICU follow-up
- clinic capacity
- linked admissions data to monitor readmissions
lmic_applicability: uncertain
notes: 'Population data-linkage cohort; association only, strong risk of selection bias (who attends). No CI in the abstract, so OE4 downgraded to OE5. No difference in emergency admissions or GP events. LMIC: few post-ICU clinics exist; mainly relevant to referral design.'
