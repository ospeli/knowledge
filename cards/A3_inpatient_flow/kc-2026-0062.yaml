- A5_outpatients
design: other
evidence_level: OE5
setting:
  country: GB
  income: HIC
  facility: regional_health_boards
kpis:
- name: icu_readmission_or_nonattenders
  definition: Adjusted odds of ICU readmission, invited non-attendees vs attendees
  effect:
    value: '2.81'
    unit: odds ratio
  evidence:
    quote: Compared with attendees, nonattendees and those not invited had higher adjusted odds of ICU readmission (odds ratio [OR] = 2.81 and 2.22, respectively), elective admissions, and hospital bed days.
- name: icu_readmission_or_not_invited
  definition: Adjusted odds of ICU readmission, not invited vs attendees
  effect:
    value: '2.22'
    unit: odds ratio
  evidence:
