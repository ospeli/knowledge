kpis:
- name: booking_notes_with_barrier_pct
  definition: Share of scheduler notes for post-discharge follow-up that recorded a barrier, Aug 2022 to Oct 2024
  effect:
    value: '29'
    unit: percent
  evidence:
    quote: Barriers were documented in 4,024 notes (29%), with 2,896 barrier notations after excluding "reason not listed."
- name: barrier_clinician_availability_pct
  definition: Share of barrier notations due to primary care clinician availability
  effect:
    value: '46'
    unit: percent
  evidence:
    quote: The most common barriers were PCP availability constraints (46%), namely accommodation requests (30%); and patient-related reasons (42%), namely patients feeling the appointment was not needed (12%).
- name: barrier_patient_related_pct
  definition: Share of barrier notations due to patient-related reasons
  effect:
    value: '42'
    unit: percent
  evidence:
    quote: The most common barriers were PCP availability constraints (46%), namely accommodation requests (30%); and patient-related reasons (42%), namely patients feeling the appointment was not needed (12%).
implementation_needs:
- short barrier pick-list inside the booking screen
- regular review of barrier data with clinic leads
- protected follow-up slots for discharged patients
lmic_applicability: partial
notes: 'Descriptive quality-improvement report; no change in follow-up rates or readmissions is reported in the abstract: OE5. Country not stated in the abstract. For A3 and A1: a one-tap "why could this not be booked" reason on the booking screen gives managers a barrier list without extra work. LMIC partial: the idea needs no EHR (a paper or phone pick-list works), but post-discharge primary care follow-up may not exist in the same form.'
