title: Schedulers logging barriers found 29% of post-discharge follow-up bookings hit one
summary: Schedulers booking primary care follow-up after hospital discharge logged barriers in a structured form refined through PDSA cycles. Barriers were recorded in 29% of notes; clinician availability (46%) and patient-related reasons (42%) were the commonest, which informed education on protected follow-up slots and outreach to clinic directors.
intervention: Structured in-workflow form for schedulers to record booking barriers, refined by PDSA cycles and reviewed with interdisciplinary teams
comparator: None
