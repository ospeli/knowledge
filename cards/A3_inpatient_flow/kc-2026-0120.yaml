title: Insurance approvals and billing delayed discharges in an Indian tertiary hospital
summary: A mixed-methods study of 320 inpatient discharges in an Indian tertiary hospital found most were timely, but a substantial share missed benchmarks because of insurance approvals, billing delays and logistics. Late exits overlapped with early-morning admissions, adding to emergency department congestion.
intervention: None (diagnostic study of discharge order to exit time)
