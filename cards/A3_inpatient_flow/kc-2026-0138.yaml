id: kc-2026-0138
version: 1
status: approved
title: Italian hospital-wide discharge work was followed by shorter complex-discharge stays and ED waits
summary: 'An Italian teaching hospital tackled ED crowding from the output side: a simulation showed boarding as the main bottleneck, and the hospital added a written set of discharge rules, digital referral routes to community and home care, and nursing protocols. Over 2019-2024, with ED volume up by about a quarter, average stay for complex discharges fell by about a quarter and overall ED waits fell by 17.8%, but boarding time rose.'
intervention: 'Hospital-wide output measures: discharge rule set, digitised community and home-care discharge pathways, nursing protocols'
comparator: Same hospital before the interventions (2019 baseline)
