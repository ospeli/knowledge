notes: 'Single-site pre-post over 199,354 ED visits with no control and secular changes (volume up 23.6%); CI reported only for satisfaction: OE5. Boarding rose, which the authors link to case complexity and a policy of not boarding medical patients on surgical wards; a reader should not take the ED gain as a boarding gain. For A3: report length of stay by discharge destination (home, home care, community bed) so delays for complex discharges are visible. Tier C: abstract read via the PubMed record, not stored in the inbox; no quotes; numbers checked against the PubMed abstract by ospeli-review-bot. LMIC partial: needs community and home-care services to discharge into.'
