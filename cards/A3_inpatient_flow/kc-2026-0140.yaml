implementation_needs:
- expected discharge date set early
- checklist given 1 to 2 days before discharge
- named person to act on unmet items
lmic_applicability: partial
notes: 'Single-site psychometric validation; no intervention or outcome comparison: OE5. Useful as a discharge-readiness tool, not proof that using it shortens stays. For A3: a short patient-facing readiness checklist tied to the expected discharge date can surface blockers a day early; items stay operational (transport, equipment, who to call), no clinical content. Tier C: abstract read via the PubMed record, not stored in the inbox; no quotes; numbers checked against the PubMed abstract by ospeli-review-bot. LMIC partial: needs translation and literacy adaptation.'
