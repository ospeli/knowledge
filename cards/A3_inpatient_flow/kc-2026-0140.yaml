id: kc-2026-0140
version: 1
status: approved
title: A 15-question discharge checklist reliably shows how ready patients feel to go home
summary: At a US tertiary hospital, 269 general medicine patients expected to leave within one to two days completed a 15-item discharge checklist. The items formed one reliable scale; patients who were younger, had shorter stays and better cognitive and mental health scored as more prepared.
intervention: Patient-completed 15-item discharge checklist 24-48 hours before expected discharge
comparator: None (validation study)
source:
  doi: 10.1097/pts.0000000000001606
  tier: C
  licence: publisher
