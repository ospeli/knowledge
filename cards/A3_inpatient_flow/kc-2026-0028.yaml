implementation_needs:
- automatic therapy consult orders in the EHR
- therapists attending ward rounds
- added therapy staffing
lmic_applicability: partial
notes: 'Single-site before-during-after design, 13,058 admissions; no effect sizes or CIs for LOS in the abstract. OE4 downgraded to OE5 for single site. Operational lever is service delivery (consult automation, staffing), not clinical treatment choice. LMIC applicability partial: needs EHR order sets and therapy staff.'
