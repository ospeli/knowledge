design: before_after
evidence_level: OE5
setting:
  country: US
  income: HIC
  facility: quaternary_academic_medical_icu
kpis:
- name: received_physical_therapy_odds
  definition: Odds of receiving physical therapy during MICU stay, intervention vs pre period
  effect:
    value: '4'
    unit: odds ratio (approximate, "nearly 4-fold")
  evidence:
    quote: During the intervention, an increased proportion of admits received physical therapy with a nearly 4-fold increase in the odds of receiving physical therapy.
- name: icu_length_of_stay
  definition: Adjusted ICU length of stay, during/post vs pre period
  effect:
    value: modest decrease (size not given in abstract)
    unit: days
  evidence:
