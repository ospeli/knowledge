id: kc-2026-0028
version: 1
status: approved
title: Physical therapy QI in a medical ICU sustained gains for three years
summary: At one US academic medical ICU, a programme of auto-consults, therapists on rounds, a bedrest-order hard stop and more therapy staff raised the odds of patients getting physical therapy nearly fourfold, with a modest fall in ICU stay sustained for three years.
intervention: 'Multifaceted physical therapy programme: education, therapists on multidisciplinary rounds, automatic consult orders, EHR hard stop on bedrest orders, extra therapy staffing and a coordinator'
comparator: Pre-intervention period
source:
  doi: 10.1093/ptj/pzag100
  tier: A
  licence: cc-by
  url: https://europepmc.org/article/MED/42765596
