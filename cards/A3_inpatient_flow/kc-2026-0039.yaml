  evidence:
    quote: Friday or Saturday arrival raised the elective proportion from 33.7% to 87.8% without altering the measured severity.
implementation_needs:
- weekend or seven-day endoscopy list
- on-call endoscopy staff
- tracking time from gastroenterology consult to procedure
lmic_applicability: partial
notes: 'Single-centre retrospective cohort (413 episodes, 2019–2025) using day of arrival as an instrument; with CIs, mapped OE4, but reviewer may prefer OE5 for a single site. Country not stated in the abstract. The stored abstract has a garbled timing definition (''urgent ( 24 h)''). Operational lever is list scheduling, not a clinical timing recommendation; the authors note only 22 deaths, so a moderate mortality effect cannot be excluded. LMIC: the bed-day cost of weekday-only lists applies wherever endoscopy is not available every day. Reviewer: mortality removed from the summary; the card makes no claim that delayed endoscopy is clinically safe.'
