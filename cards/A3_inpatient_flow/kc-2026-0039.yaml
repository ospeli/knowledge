  evidence:
    quote: 'Total stay was longer with delay (incidence rate ratio: 1.40, 95% CI: 1.14 to 1.73), while stay from endoscopy onward was not (1.05, 95% CI: 0.80 to 1.38), and each day of waiting added 1.03 days of admission (95% CI: 0.60 to 1.46).'
