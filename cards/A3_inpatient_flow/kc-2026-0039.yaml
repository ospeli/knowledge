id: kc-2026-0039
version: 1
status: approved
title: Friday–Saturday arrivals waited longer for endoscopy and used more bed-days
summary: In one tertiary centre, arriving on a Friday or Saturday pushed most bleeding patients past 24 h for endoscopy because of the weekday list. Total hospital stay was longer with delay and the extra bed-days roughly equalled the wait.
intervention: Endoscopy after 24 h, driven by a weekday-only endoscopy schedule (Friday/Saturday arrival used as a natural experiment)
comparator: Endoscopy within 24 h
source:
  doi: 10.3390/jcm15207820
  tier: A
  licence: cc-by
  url: https://doi.org/10.3390/jcm15207820
