setting:
  country: unknown
  income: unknown
  facility: tertiary_ed
kpis:
- name: total_length_of_stay_irr
  definition: Total hospital stay, delayed vs early endoscopy (incidence rate ratio)
  effect:
    value: '1.40'
    unit: incidence rate ratio
    ci:
    - '1.14'
