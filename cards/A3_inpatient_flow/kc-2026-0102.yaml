id: kc-2026-0102
version: 1
status: candidate
title: Same-day discharge after complex ablation saved a bed night with no rise in complications
summary: At one European heart centre, 70 patients discharged the same day after complex ablation had complication rates similar to 135 kept overnight. The authors estimate a same-day policy would have saved about €480 per patient, mainly from the bed night.
intervention: Same-day discharge pathway after complex ablation
comparator: Next-day discharge
source:
  doi: 10.3390/jcdd13100501
  tier: A
  licence: cc-by
  url: https://doi.org/10.3390/jcdd13100501
domains:
- A3_inpatient_flow
design: other
evidence_level: OE5
setting:
  country: unknown
  income: HIC
  facility: acute_hospital
kpis:
- name: cost_saving_per_patient_eur
  definition: Estimated cost saved per patient under a same-day discharge policy (mean ± SD; the ± figure is a standard deviation, not a CI)
  effect:
    value: '479.84'
    unit: EUR per patient
  evidence:
    quote: The SDD policy for CAP during this period would have saved €479.84 ± €248.09 per patient.
- name: early_minor_complication_pct
  definition: Early minor complications, same-day vs next-day discharge (p = 0.191, not significant)
  effect:
    value: 8.6 vs 3.7
    unit: percent
  evidence:
    quote: 'Among patients included in the final analysis, the overall complication rate was low (8.8%), with no differences between groups (early minor complications, 5.4%: 8.6% vs. 3.7% for SDD vs. NDD, p = 0.191; late major complications, 0.5%: 0% vs. 0.7%, p = 1; late minor complications, 3.4%: 2.9% vs. 3.7%, p = 1).'
implementation_needs:
- clinician-agreed eligibility for same-day discharge
- afternoon observation space
- same-day discharge flag on the bed board
lmic_applicability: uncertain
notes: 'Single-centre retrospective comparison, groups not randomised (45 higher-risk patients excluded), no CI: OE4 downgraded to OE5. Country not stated in the abstract (costs in euros). Who is eligible is a clinical decision; the operational lesson is that a same-day pathway for elective procedures releases beds and should appear as a planned discharge. LMIC uncertain: complex ablation is rare in LMIC settings, though the pathway idea transfers to other day-case procedures.'
review_by: '2031-11-15'
