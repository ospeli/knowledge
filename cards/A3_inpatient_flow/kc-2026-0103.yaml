title: Meeting an 85% average occupancy target still left neonatal ICUs over 100% on many days
summary: Using several years of neonatal ICU data from Calgary, a queueing model with time-varying admissions and real length-of-stay patterns showed that units meeting the long-run 85% occupancy rule still often ran above 100% on individual days. Static rules of thumb were inadequate under fluctuating demand.
intervention: Time-varying queueing model (Mt/Gt/infinity) for bed planning
comparator: Average-based and fixed-occupancy rules (85% rule)
source:
