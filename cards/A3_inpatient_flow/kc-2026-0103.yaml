- length-of-stay distribution, not just the mean
- planning tool that reports days over capacity
lmic_applicability: partial
notes: 'Modelling study on one region''s data; validation not described in the abstract: OE5. No effect size is given, so no number is carded. Lesson for A3 and capacity planning: report the share of days over capacity, not only mean occupancy. LMIC partial: needs a few years of admission and discharge dates, which a paper register can supply.'
