id: kc-2026-0029
version: 1
status: approved
title: Simulated discharge fixes projected cutting average discharge time by over half
summary: In a public hospital, Lean Six Sigma found tests and discharge medicines were the main discharge bottlenecks; a simulation projected that prioritising discharge tests and a dedicated discharge pharmacy line would cut average discharge time by more than half.
intervention: Prioritised discharge-related tests plus a dedicated discharge-medication pharmacy line (tested in simulation)
comparator: Observed baseline discharge process
source:
  doi: 10.1016/j.jer.2026.10.067
  tier: B
  licence: cc-by-nc-nd
  url: https://doi.org/10.1016/j.jer.2026.10.067
domains:
