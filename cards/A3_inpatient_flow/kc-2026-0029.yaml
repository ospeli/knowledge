- A8_pharmacy
design: simulation_des
evidence_level: OE5
setting:
  country: unknown
  income: unknown
  facility: public_hospital
kpis:
- name: discharge_time_baseline_hours
  definition: Observed baseline average discharge time (simulated baseline in brackets)
  effect:
    value: '20.5'
    unit: hours
  evidence:
    quote: The simulated baseline model (20.39 h) was consistent with the observed baseline discharge time (20.5 h).
- name: discharge_time_projected_hours
  definition: Projected average discharge time with both changes
  effect:
    value: '8.99'
    unit: hours
  evidence:
    quote: The simulation results indicate that prioritizing discharge-related examinations combined with a dedicated discharge-medication pharmacy line could reduce the average discharge time to a projected 8.99 h, and the estimated sigma level could increase from an observed 2.88 to a projected 4.14.
