id: kc-2026-0088
version: 1
status: candidate
title: Routine triage data predicted which ED patients would be admitted
summary: Across two Canadian academic hospitals (526,145 adult ED visits, 2015-2022), a model using only data available at the end of triage predicted hospital admission with an AUC of 0.86 (sensitivity 0.67, specificity 0.86); a simpler logistic regression reached 0.84. It could give the bed office earlier warning of admissions, but has not been tested prospectively.
intervention: Gradient boosting (XGBoost) admission prediction at end of triage
comparator: Logistic regression baseline
source:
  doi: 10.2196/98273
  tier: C
  licence: unknown
