implementation_needs:
- structured triage data (age, triage score, arrival mode, vital signs, chief complaint)
- count of prior hospitalisations
- local recalibration and prospective check
lmic_applicability: uncertain
notes: 'Retrospective model development with internal hold-out only (17.4% admitted); no prospective or external validation, so OE5 as an unvalidated model. Operational use only: an aggregate forecast of expected admissions for bed planning, advisory with an off switch; never a per-patient triage or disposition decision. Note the simpler logistic model was close (0.84), which is easier to explain and run offline. LMIC uncertain: needs reliable structured triage data. Tier C: abstract read via the PubMed record, not stored in the inbox; numbers copied as stated and need evidence.checked_by from a reviewer before approval.'
