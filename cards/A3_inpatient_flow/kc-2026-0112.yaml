title: Two in five general medicine inpatients were medically ready to leave on one day
summary: A one-day survey of 1,348 general medicine inpatients in 21 US veterans' hospitals found 41.9% were medically ready for discharge (range across hospitals about 18% to 65%) and 18.1% had waited a week or more. More than half of those long waits were for a nursing home or assisted living place, with payer and choice of destination the main things awaited.
