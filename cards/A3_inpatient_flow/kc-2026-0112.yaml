notes: 'Multi-site cross-sectional point-prevalence survey filled in by attending physicians; no CI (ranges across hospitals are noted in the units): OE4 downgraded to OE5. Tier C: finding written from the abstract on the PubMed record (PMID 42877989), no quotes; a human reviewer must check the numbers. Supports A3: a medically-ready flag with a wait reason makes this measurable from the bed board. LMIC partial: long-term care placement is a smaller factor where such facilities are few, but the flag and reason codes transfer.'
