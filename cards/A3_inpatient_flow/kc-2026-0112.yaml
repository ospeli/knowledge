id: kc-2026-0112
version: 1
status: candidate
title: Two in five general medicine inpatients were medically ready to leave on one day
summary: A one-day survey of 1,348 general medicine inpatients in 21 US veterans' hospitals found 41.9% were medically ready for discharge (range across hospitals about 18% to 65%) and 18.1% had waited a week or more. More than half of those long waits were for a nursing home or assisted living place, with payer and choice of destination the main things awaited.
intervention: None (point-prevalence survey of discharge readiness and barriers)
comparator: Variation across 21 hospitals
source:
  doi: 10.1002/jhm.70511
  tier: C
  licence: unknown
  url: https://doi.org/10.1002/jhm.70511
domains:
- A3_inpatient_flow
- E2_primary_community
design: other
evidence_level: OE5
setting:
  country: US
  income: HIC
  facility: veterans_health_system
  sites: 21
kpis:
- name: medically_ready_inpatients_pct
  definition: Share of sampled general medicine inpatients medically ready for discharge on the survey day
  effect:
    value: '41.9'
    unit: percent
    ci:
    - '18.4'
    - '64.7'
- name: major_discharge_barrier_pct
  definition: Share of sampled inpatients medically ready for discharge for one week or more
  effect:
    value: '18.1'
    unit: percent
    ci:
    - '0'
    - '32'
implementation_needs:
- daily medically-ready flag per bed
- reason-for-wait code (placement, payer, family choice, transport)
- weekly review of the longest waits
lmic_applicability: partial
notes: 'Multi-site cross-sectional point-prevalence survey filled in by attending physicians; no CI (the ci field holds the range across hospitals, not a confidence interval): OE4 downgraded to OE5. Tier C: finding written from the abstract on the PubMed record (PMID 42877989), no quotes; a human reviewer must check the numbers. Supports A3: a medically-ready flag with a wait reason makes this measurable from the bed board. LMIC partial: long-term care placement is a smaller factor where such facilities are few, but the flag and reason codes transfer.'
review_by: '2031-11-15'
