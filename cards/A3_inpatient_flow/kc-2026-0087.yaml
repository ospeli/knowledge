title: Doubling ward pharmacist hours raised pharmacist involvement in discharges
summary: On one respiratory ward of an Australian tertiary hospital, doubling clinical pharmacist staffing and extending their hours raised the share of discharges with pharmacist involvement from 78% to 95%. Admission medication reconciliation rose from 81% to 91%, but that change was not statistically significant.
intervention: Doubled clinical pharmacist staffing with extended hours of ward pharmacist availability
comparator: Usual pharmacist staffing and hours (pre-intervention audit)
