title: Patients with limited English most valued discharge instructions in their language
summary: In a choice experiment with 89 Spanish- and Haitian Creole-speaking inpatients, how discharge instructions were recorded carried the most weight, followed by how teaching was spoken. Patients preferred written or audio instructions in their own language and staff who speak it.
intervention: Discharge communication options (instruction format, interpreter mode, family involvement, follow-up call)
comparator: Alternative levels within each attribute
