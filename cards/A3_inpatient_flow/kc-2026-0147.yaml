implementation_needs:
- discharge instructions available in the main local languages
- interpreter or language-concordant staff booked for discharge teaching
- option to record audio instructions
lmic_applicability: partial
notes: 'Single-site stated-preference study (n=89) with CIs: OE4. Measures preferences, not readmissions or delays. Country not stated in the abstract. For A3: the discharge checklist can carry a "language needed" flag and "instructions given in preferred language" tick, so it is planned before the day of discharge. LMIC partial: multilingual settings are common, written translation capacity may be limited.'
