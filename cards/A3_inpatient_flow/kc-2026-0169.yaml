notes: 'Single-site retrospective cohort, adjusted, with CI; overall CI includes no effect: OE4. Subgroup results depend on treatment type and are left out as clinical. Tier C: abstract read via PubMed (PMID 43077574), not stored in the inbox; no quotes; reviewer to fill checked_by. For A3: supports recording which discharge-support roles were involved so readmission can be compared. LMIC uncertain: specialist social work posts are scarce.'
