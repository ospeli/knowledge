title: 'Addiction-consult social worker: 30-day readmission RR 0.89, CI includes no effect'
summary: At a US safety-net hospital, 53% of 5,069 hospitalisations with an addiction consult also had a specialist social worker. Adjusted 30-day readmission risk was lower with social work, though the confidence interval reached no difference; the clearer link was in one subgroup.
intervention: Specialist social worker added to the inpatient addiction consult team
comparator: Addiction consults without documented social work involvement
source:
  doi: 10.1097/adm.0000000000001809
  tier: C
  licence: publisher
