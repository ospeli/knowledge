id: kc-2026-0139
version: 1
status: candidate
title: Virtual nursing across nine US hospitals linked to shorter stays after about six months
summary: Across nine hospitals in one US health system, a central virtual nursing programme (remote nurses supporting admission and other ward tasks) was followed by a fall in hospital length of stay of about 0.8 days and ED length of stay of about 0.4 hours, compared with hospitals that had not yet started. The gains appeared only six to seven months after go-live.
intervention: Centralised virtual nursing programme (staggered go-live by hospital)
comparator: Not-yet-implemented hospitals (staggered difference-in-differences)
source:
  doi: 10.1016/j.ijmedinf.2026.106791
  tier: C
  licence: publisher
  url: https://doi.org/10.1016/j.ijmedinf.2026.106791
domains:
