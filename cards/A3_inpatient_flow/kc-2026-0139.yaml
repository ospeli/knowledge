implementation_needs:
- remote nursing team and video links to rooms
- admission and discharge task lists split between bedside and remote nurses
- at least 6 to 12 months of follow-up before judging
lmic_applicability: uncertain
notes: 'Retrospective staggered difference-in-differences on 129,080 encounters with not-yet-treated hospitals as comparators, plus matched analyses; observational, one health system: OE3. Median hospital stay did not change (3.9 days) while the mean fell, so the gain is in longer stays. For A3: judge a workflow change on a 6 to 12 month run chart, not the first months. Tier C: abstract read via the PubMed record, not stored in the inbox; no quotes; numbers need checking against the source by a reviewer (checked_by left empty). LMIC uncertain: needs reliable video links and spare nursing capacity.'
