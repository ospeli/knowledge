title: Ethiopian IDP camp stock-outs blamed on central buying, donor reliance, weak forecasting
summary: Interviews with health staff, government and donor stakeholders described a multi-level medicine supply chain for displaced-person camps in Ethiopia. Interviewees reported frequent stock-outs driven by centralised procurement, donor dependence and weak forecasting; other challenges were poor storage, no cold chain, manual inventory and a weak logistics information system.
