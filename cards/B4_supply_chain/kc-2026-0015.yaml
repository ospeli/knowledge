id: kc-2026-0015
version: 1
status: approved
title: Machine-learning forecasts cut estimated stock-out costs for erratic-demand drugs
summary: At one large hospital pharmacy, a demand-forecasting model for high-value, intermittent-demand drugs, used with a safety buffer, cut the estimated financial impact of stock-outs by about 70% for erratic-demand drugs versus manual ordering.
intervention: LightGBM-Tweedie weekly demand forecasting with a strategic inventory buffer
comparator: Historical manual procurement orders
source:
  doi: 10.1136/bmjopen-2026-119366
  tier: B
  licence: cc-by-nc
  url: https://doi.org/10.1136/bmjopen-2026-119366
domains:
- B4_supply_chain
- A8_pharmacy
- D3_it_digital
design: forecasting
evidence_level: OE5
setting:
  country: CN
  income: UMIC
  facility: tertiary_hospital_pharmacy
kpis:
- name: forecast_wmape_pct
  definition: Weighted mean absolute percentage error of weekly demand forecasts, complex demand patterns, 2024 test set
  effect:
    value: '21.4'
    unit: percent
  evidence:
    quote: In the targeted analysis of complex demand patterns, our model achieved a wMAPE of 21.4%, with approximately 3% improvement on the baseline naïve model.
- name: stockout_financial_impact_pct_change
  definition: Estimated financial impact of stock-outs, erratic-demand drugs, model vs manual practice
  effect:
    value: '-70'
    unit: percent
  evidence:
    quote: By implementing a strategic inventory buffer, the model reduced the estimated financial impact of stockouts by approximately 70% for erratic-demand drugs compared with manual practices.
implementation_needs:
- weekly drug usage history (several years)
- item demand classification
- pharmacist review of suggested orders
lmic_applicability: partial
notes: 'Single-site retrospective model evaluation on a held-out year; savings are estimated from cost proxies, not from implementation; no confidence intervals. Downgraded from OE4 to OE5. Holding costs rose moderately. If used in Ospeli this is an AI suggestion: the pharmacist decides, with an off switch. Licence cc-by-nc (community KB only).'
review_by: '2031-11-06'
approval:
