  definition: Risk of drug stock-outs (qualitative, no pooled figure)
  evidence:
    quote: In addition, the study also emphasized the importance of integrated information systems and electronic prescription systems to improve the accuracy of stock monitoring and reduce the risk of stock outs.
- name: budget_share_category_a
  definition: Share of the drug budget absorbed by category A items (qualitative)
  evidence:
    quote: Category A drugs, despite their small number of items, absorb the largest portion of the budget and therefore require close monitoring.
