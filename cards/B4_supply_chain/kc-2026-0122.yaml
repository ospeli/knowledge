title: ABC critical-index analysis guides hospital drug stock control in Indonesia
summary: A systematic review of eight Indonesian studies found hospitals use ABC critical-index analysis to focus monitoring on the few drugs that take most of the budget. Integrated information systems, e-prescribing, Economic Order Quantity and reorder points were linked to better stock monitoring and fewer stock-outs.
intervention: ABC critical-index classification of drug inventory, with EOQ and reorder points
comparator: None
