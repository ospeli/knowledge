title: 'Hospital drug shortages are handled in three phases: detect, respond, then review'
summary: A scoping review of 31 studies, mostly from high-income settings, mapped how hospital pharmacy teams manage drug shortages. Work fell into three linked phases (detection and assessment, response, mitigation and evaluation), using procurement changes, inventory control, substitution, allocation rules and moving stock between facilities, supported by communication systems.
intervention: Structured shortage-management workflow (detect, respond, mitigate and evaluate)
