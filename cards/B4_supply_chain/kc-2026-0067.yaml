id: kc-2026-0067
version: 1
status: candidate
title: 'Ethiopia: child medicine stock-outs linked to less care seeking and treatment'
summary: In a national Ethiopian survey analysis, 41.3% of primary facilities had paediatric medicine stock-outs; children served by those facilities had lower odds of being taken for care and of receiving recommended treatment.
intervention: Essential paediatric commodity stock-out at the local facility in the past month (exposure)
comparator: Facilities without stock-outs
source:
  doi: 10.21203/rs.3.rs-10996829/v1
  tier: A
  licence: cc-by
  url: https://doi.org/10.21203/rs.3.rs-10996829/v1
domains:
- B4_supply_chain
- A8_pharmacy
- E2_primary_community
design: other
evidence_level: OE5
setting:
  country: ET
  income: LIC
  facility: primary_health_facilities_national
kpis:
- name: stockout_prevalence_pct
  definition: Primary facilities with an essential paediatric medicine stock-out in the preceding month
  effect:
    value: '41.3'
    unit: percent
  evidence:
    quote: Overall, 41.3% of local primary health facilities experienced essential pediatric medicine stock outs in the preceding month.
- name: care_seeking_aor
  definition: Adjusted odds of formal care seeking, stock-out vs no stock-out facility
  effect:
    value: '0.58'
    unit: adjusted odds ratio
  evidence:
    quote: Children served by facilities with stock outs had 42% lower odds of formal care seeking (adjusted odds ratio = 0.58) and 56% lower odds of receiving appropriate clinical treatment (adjusted odds ratio = 0.44).
- name: appropriate_treatment_aor
  definition: Adjusted odds of receiving recommended treatment, stock-out vs no stock-out facility
  effect:
    value: '0.44'
    unit: adjusted odds ratio
  evidence:
    quote: Children served by facilities with stock outs had 42% lower odds of formal care seeking (adjusted odds ratio = 0.58) and 56% lower odds of receiving appropriate clinical treatment (adjusted odds ratio = 0.44).
implementation_needs:
- monthly stock status reporting from facilities
- tracer list of essential paediatric commodities
- resupply trigger levels
lmic_applicability: 'yes'
notes: 'Preprint (Research Square), not peer reviewed: OE5. Cross-sectional multilevel analysis of 8,452 children; no CIs in the abstract. Reviewer please check how survey households were linked to facility audits, as the method is not clear from the abstract.'
review_by: '2031-11-09'
