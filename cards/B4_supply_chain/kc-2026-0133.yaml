id: kc-2026-0133
version: 1
status: approved
title: Argentina's medicine programme bought faster when run under multi-year, ring-fenced budgets
summary: Over 2002-2024, Argentina's REMEDIAR programme delivered free essential medicines to more than 8,000 primary care centres. Under international loan rules (multi-year budgets, ring-fenced funds, predictable payment) procurement took 48% less time than under national treasury funding, and central buying paid about a quarter of market price.
intervention: Centralised procurement and direct delivery under multi-year, ring-fenced budgeting (international loan rules)
comparator: Same programme under annual national treasury funding; decentralised subnational buying as price benchmark
source:
  doi: 10.1080/23288604.2026.2732522
  tier: A
  licence: cc-by
  url: https://doi.org/10.1080/23288604.2026.2732522
domains:
- B4_supply_chain
- A8_pharmacy
- D1_finance_costing
design: case_study
evidence_level: OE5
setting:
  country: AR
  income: UMIC
  facility: national_medicines_supply_system
kpis:
- name: procurement_timeline
  definition: Time to complete a procurement process, loan-financed vs nationally financed
  effect:
    value: -48
    unit: percent
  evidence:
    quote: IDB-financed operations showed more stable budget execution, procurement timelines 48% shorter than nationally financed processes, and lower awarded prices, while treasury financing exhibited greater volatility tied to fiscal cycles and currency depreciation.
- name: awarded_price_vs_market
  definition: Awarded price as a share of market price, central vs decentralised subnational buying
  effect:
    value: 25 vs 46
    unit: percent of market price
  evidence:
    quote: Centralized procurement averaged 25% of market prices versus 46% under a decentralized subnational benchmark, though at the cost of slower formulary adaptation.
implementation_needs:
- procurement start and award dates recorded
- multi-year budget for medicines
- predictable payment to suppliers
lmic_applicability: 'yes'
notes: 'Longitudinal single case study with descriptive time series; the authors state no causal effects are estimated; no CIs: OE5. The authors attribute the gains to the management rules, not the source of money. Central buying came with slower formulary change. For B4: record procurement cycle time (request to award to delivery) as a KPI alongside price. LMIC yes: upper-middle-income, public primary care.'
