id: kc-2026-0132
version: 1
status: candidate
title: Ethiopian children near clinics with medicine stock-outs were less often taken for care
summary: In Ethiopia's 2024/2025 national survey linked to facility audits, 41.3% of local primary health facilities had a stock-out of essential child medicines in the past month. Sick children served by those facilities had lower odds of being taken for formal care and of receiving the recommended treatment.
intervention: 'None (observational: facility stock-out of essential child medicines in the preceding month)'
comparator: Children served by facilities without a stock-out
source:
  doi: 10.21203/rs.3.rs-10996829/v1
  tier: A
  licence: cc-by
  url: https://doi.org/10.21203/rs.3.rs-10996829/v1
domains:
- B4_supply_chain
- A8_pharmacy
- E2_primary_community
design: other
evidence_level: OE5
setting:
  country: ET
  income: LIC
  facility: primary_health_facilities_national
kpis:
- name: facility_stockout_prevalence
  definition: Share of local primary health facilities with any essential child-medicine stock-out in the preceding month
  effect:
    value: 41.3
    unit: percent of facilities
  evidence:
    quote: Overall, 41.3% of local primary health facilities experienced essential pediatric medicine stock outs in the preceding month.
- name: formal_care_seeking_odds
  definition: Adjusted odds that a sick child under five was taken for formal care, stock-out vs no stock-out
  effect:
    value: 0.58
    unit: adjusted odds ratio
  evidence:
    quote: Children served by facilities with stock outs had 42% lower odds of formal care seeking (adjusted odds ratio = 0.58) and 56% lower odds of receiving appropriate clinical treatment (adjusted odds ratio = 0.44).
- name: recommended_treatment_odds
  definition: Adjusted odds that the child received the recommended treatment, stock-out vs no stock-out
  effect:
    value: 0.44
    unit: adjusted odds ratio
  evidence:
    quote: Children served by facilities with stock outs had 42% lower odds of formal care seeking (adjusted odds ratio = 0.58) and 56% lower odds of receiving appropriate clinical treatment (adjusted odds ratio = 0.44).
implementation_needs:
- stock level recorded per item per facility
- stock-out days counted each month
- essential item list agreed
lmic_applicability: 'yes'
notes: 'Preprint; cross-sectional multilevel analysis of survey data linked to facility readiness audits (8452 children); association, not cause; abstract gives no CIs: OE5. Treatment content is clinical and out of scope; the operational point is that a stock-out also suppresses demand, so lost visits are a hidden cost of empty shelves. For B4 and the shared stock object: count stock-out days per essential item, not just whether an item is in stock today. LMIC yes: Ethiopia.'
review_by: '2031-11-19'
