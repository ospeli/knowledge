id: kc-2026-0060
version: 1
status: approved
title: Theatre management web app detected scheduling conflicts with 92.5% accuracy
summary: A progressive web app combining theatre booking, anaesthesia planning, instrument trays and dashboards correctly flagged most scheduling conflicts on a test set of 40 schedules (17 of 19 conflicts and 20 of 21 non-conflicts); the scheduling module covered 18 theatres.
intervention: Integrated mobile/web theatre management application with automatic conflict detection
comparator: Reference-standard labelled schedules (diagnostic test dataset)
source:
  doi: 10.62441/actainnovations.vi.2560
  tier: A
  licence: cc-by
