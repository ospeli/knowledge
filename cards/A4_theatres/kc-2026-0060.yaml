  country: unknown
  income: unknown
  facility: hospital_theatre_suite
kpis:
- name: conflict_detection_accuracy_pct
  definition: Overall accuracy of scheduling-conflict detection on test dataset
  effect:
    value: '92.50'
    unit: percent
  evidence:
    quote: For scheduling conflict detection, the application demonstrated 89.47% sensitivity, 95.24% specificity, 94.44% positive predictive value, 90.91% negative predictive value and 92.50% overall accuracy.
- name: conflict_detection_sensitivity_pct
  definition: Share of true scheduling conflicts flagged
  effect:
    value: '89.47'
    unit: percent
  evidence:
    quote: For scheduling conflict detection, the application demonstrated 89.47% sensitivity, 95.24% specificity, 94.44% positive predictive value, 90.91% negative predictive value and 92.50% overall accuracy.
implementation_needs:
- defined theatre hours and turnover buffer (30 minutes used)
- stakeholder workshops to map OT process
- role-based access
lmic_applicability: partial
notes: Development and technical validation only (19 conflicts, 21 non-conflicts); no data on utilisation, cancellations or turnover time. OE5. Country and hospital type not stated in the abstract, so left unknown. The 18 theatres are the scheduling module scope; the test set was 40 schedules.
