title: Process map and driver diagram lifted on-time pre-surgery plans from 26% to 63%
summary: A US children's hospital used a process map, key driver diagram and p-chart to raise the share of pre-surgery plans for a high-risk group finished at least seven days ahead. After standard documentation in the record and clearer roles and communication, the share rose from a mean of 26% to 63% and held for over a year, short of the 80% aim.
intervention: Process map, key driver diagram, standard plan template in the record, defined roles and communication
comparator: Baseline period at the same centre
