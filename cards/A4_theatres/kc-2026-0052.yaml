notes: Single-site quasi-experimental pre-post (24 staff, 336 vs 336 patients) with no control group; eight-item Likert-scale instrument (who rated is not stated in the abstract). Patient-outcome changes are not quantified in the abstract and cannot be attributed causally (authors say so). OE4 downgraded to OE5 for single site and no control. Hospital is named in the source; no individuals.
