title: Non-technical skills training raised theatre team scores in an Ethiopian hospital
summary: After context-adapted non-technical skills training, operating-room staff scores rose and held at one month; fewer adverse events and care delays followed, though without a control group.
intervention: Context-adapted multidisciplinary non-technical skills training for operating-room teams
comparator: Baseline (pre-training) scores and pre-intervention patients
