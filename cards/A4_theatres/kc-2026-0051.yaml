title: Surgeon–scrub nurse familiarity shortened procedures across a whole hospital
summary: Across 33,374 procedures at a US academic centre, one standard deviation more surgeon–scrub familiarity cut surgery duration by 1.9 to 3.7 minutes under the authors' causal model; scrub–circulator familiarity had no effect.
intervention: Higher surgeon–scrub nurse team familiarity (shared work frequency)
comparator: Lower familiarity
source:
  doi: 10.1007/s10729-026-09780-8
