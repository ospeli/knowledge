  definition: Change in surgery duration per one SD increase in surgeon–scrub familiarity
  effect:
    value: -1.9 to -3.7
    unit: minutes
  evidence:
    quote: Specifically, increasing familiarity by one standard deviation leads to a reduction of 1.9 to 3.7 minutes in surgery duration.
implementation_needs:
- rostering that keeps surgeon–scrub pairs together
- theatre roster and case-time data linked
- monitoring of team stability
lmic_applicability: partial
notes: 'Single-centre retrospective study (2017–2023) with structural causal modelling; effect is causal only under the assumed DAG. No CIs in the abstract. OE4 downgraded to OE5 by reviewer (single site, no CI in abstract). LMIC: rostering for stable pairs is low cost; small minute savings matter most in high-volume lists.'
