title: At one Indonesian hospital, EMR tangible benefits were 1.86 times running costs
summary: At an Indonesian national specialist hospital, running costs of electronic medical records over 2020 to 2025 were set against tangible benefits (cost displacement and cost avoidance). The benefit-cost ratio was 1.86; the authors note this covers running costs only, not full economic feasibility.
intervention: Electronic medical record in routine use
comparator: Ongoing operational cost of the EMR (benefit-cost ratio)
